    if(r.status===401){CODE='';try{localStorage.removeItem('yaman_parent_code')}catch(_){}return login(t('bad'))}
    if(!r.ok)throw 0;DATA=(await r.json()).data||{};if(w.ok)RW=await w.json();draw();
  }catch(e){$('app').innerHTML=`<div class="card">${t('fail')} <button id="rt">${t('retry')}</button></div>`;$('rt').onclick=load}
}
function timeline(E){
  const W=7*864e5,now=Date.now(),sOf=id=>META.topics.find(x=>x.id===id)?.s;const acc={};
  E.forEach(e=>{const w=Math.floor((now-e.ts)/W);if(w>7||!e.topics)return;for(const [id,[r,n]] of Object.entries(e.topics)){const s=sOf(id);if(!s)continue;acc[s]=acc[s]||Array.from({length:8},()=>[0,0]);acc[s][7-w][0]+=r;acc[s][7-w][1]+=n}});
  const subs=Object.keys(acc);if(!subs.length)return `<section class="card"><h2>${t('timeline')}</h2><p class="muted">${t('noTl')}</p></section>`;
  const X=i=>44+i*52,Y=v=>160-v*1.3;
  const lines=subs.map(sid=>{const s=subj(sid);const pts=acc[sid].map((v,i)=>v[1]?[X(i),Y(100*v[0]/v[1])]:null).filter(Boolean);return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:none;stroke:var(${s.c})" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" style="fill:var(${s.c})"/>`).join('')}`}).join('');
  const lbl=Array.from({length:8},(_,i)=>{const d=new Date(now-(7-i)*W);return `<text x="${X(i)}" y="182" font-size="10" text-anchor="middle" style="fill:var(--muted)">${d.getDate()}.${d.getMonth()+1}</text>`}).join('');
  return `<section class="card"><h2>${t('timeline')}</h2><svg viewBox="0 0 420 192" style="width:100%;height:auto" role="img" aria-label="${t('timeline')}">${[0,50,100].map(g=>`<line x1="34" x2="414" y1="${Y(g)}" y2="${Y(g)}" style="stroke:var(--line)"/><text x="28" y="${Y(g)+4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${g}%</text>`).join('')}${lines}${lbl}</svg><div class="row">${subs.map(sid=>{const s=subj(sid);return `<span class="chip" style="color:var(${s.c});border-color:var(${s.c})">● ${sn(s)}</span>`}).join('')}</div></section>`}
function testsCard(S){const td=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());const du=d=>Math.round((new Date(d+'T00:00:00')-new Date(td+'T00:00:00'))/864e5);
  const ts=(S.tests||[]).filter(x=>du(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  return `<section class="card"><div class="row between"><h2>${t('tests')}</h2><a class="go" href="/#test" target="_blank">＋ ${t('addTest')}</a></div>${ts.length?ts.map(x=>{const s=subj(x.sub)||META.subj[0],n=du(x.date);return `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><b style="color:var(${s.c})">${sn(s)}</b> ${esc(x.title||'')} <span class="muted small ar">${x.ids.map(id=>META.topics.find(z=>z.id===id)?.n).filter(Boolean).map(esc).join('، ')}</span></span><span class="chip ${n<=2?'warn':''}">${n===0?t('todayT'):n===1?t('tomorrowT'):t('daysLeft').replace('{n}',n)}</span></div>`}).join(''):'<p class="muted small" style="margin:0">—</p>'}</section>`}
function draw(){
  const data=DATA,S=data?.S||{},E=data?.E||[],now=Date.now(),today=fmtDay(new Date());
  const mins=S.minutes||{},lessons=S.lessons||{},mast=S.mastery||{},rev=Object.values(S.review||{});
  const days=[];for(let i=6;i>=0;i--){const d=new Date(now-i*864e5);days.push({k:fmtDay(d),l:new Intl.DateTimeFormat(loc(),{weekday:'short',timeZone:'Asia/Jerusalem'}).format(d),m:mins[fmtDay(d)]||0})}
  const week=days.reduce((a,b)=>a+b.m,0),done=META.topics.filter(x=>lessons[x.id]?.done).length;
  const weekEx=E.filter(x=>now-x.ts<7*864e5),avg=weekEx.length?Math.round(weekEx.reduce((a,b)=>a+b.score,0)/weekEx.length):null;
  const due=rev.filter(r=>r.due<=now).length,stars=S.stars||0;let li=0;LV.forEach((v,k)=>{if(stars>=v)li=k});
  const last=data?.updated?new Intl.DateTimeFormat(loc(),{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jerusalem'}).format(new Date(data.updated)):t('none');
  const mx=Math.max(30,...days.map(d=>d.m));
  const bars=`<svg viewBox="0 0 420 190" style="width:100%;height:auto" role="img" aria-label="${t('week')}">${[0,mx/2,mx].map(g=>`<line x1="34" x2="410" y1="${150-g/mx*120}" y2="${150-g/mx*120}" style="stroke:var(--line)"/><text x="28" y="${154-g/mx*120}" font-size="11" text-anchor="end" style="fill:var(--muted)">${Math.round(g)}</text>`).join('')}${days.map((d,i)=>{const h=d.m/mx*120,x=48+i*52;return `<rect x="${x}" y="${150-h}" width="34" height="${h}" rx="5" style="fill:var(${d.k===today?'--accent':'--s-math'});opacity:${d.k===today?1:.75}"/>${d.m?`<text x="${x+17}" y="${144-h}" font-size="11" text-anchor="middle" style="fill:var(--ink)">${d.m}</text>`:''}<text x="${x+17}" y="170" font-size="12" text-anchor="middle" style="fill:var(--muted)">${d.l}</text>`}).join('')}</svg>`;
  const ex=E.slice(-12);let chart=`<p class="muted">${t('noEx')}</p>`;
  if(ex.length){const X=i=>40+(ex.length===1?170:i*360/(ex.length-1)),Y=s=>150-s*1.2;const pts=ex.map((e,i)=>`${X(i)},${Y(e.score)}`).join(' ');
    chart=`<svg viewBox="0 0 420 190" style="width:100%;height:auto" role="img" aria-label="${t('scores')}">${[0,50,100].map(g=>`<line x1="34" x2="410" y1="${Y(g)}" y2="${Y(g)}" style="stroke:var(--line)"/><text x="28" y="${Y(g)+4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${g}</text>`).join('')}<polyline points="${pts}" style="fill:none;stroke:var(--accent)" stroke-width="3"/>${ex.map((e,i)=>`<a href="/#result-${e.ts}" target="_blank"><circle cx="${X(i)}" cy="${Y(e.score)}" r="${i===ex.length-1?7:5}" style="fill:var(${e.review?'--s-he':'--accent'});cursor:pointer"/></a><text x="${X(i)}" y="${Y(e.score)-11}" font-size="11" text-anchor="middle" style="fill:var(--ink)">${e.score}</text><text x="${X(i)}" y="172" font-size="10" text-anchor="middle" style="fill:var(--muted)">${new Date(e.ts).getDate()}.${new Date(e.ts).getMonth()+1}</text>`).join('')}</svg>`}
  const rows=META.topics.map(x=>{const l=lessons[x.id],m=mast[x.id],mp=m&&m.t?Math.round(100*m.r/m.t):null,s=subj(x.s);const S_=t('st');
    const st=!l?[S_[0],'']:mp===null?[S_[1],'']:mp>=80?[S_[2],'good']:mp>=60?[S_[3],'warn']:[S_[4],'bad'];return {x,l,mp,m,s,st}});
  const weak=rows.filter(r=>r.st[1]==='bad'||(r.l&&r.l.score<70));
  const claims=(S.claims||[]),pend=claims.filter(c=>!RW.given.includes(c.id));
  $('app').innerHTML=`
  <header class="row between"><div><h1>${t('title')}</h1><div class="muted small">${t('last')}: ${esc(last)}</div></div><div class="row"><a class="go" href="/" target="_blank" rel="noopener">${t('open')}</a><a class="go" href="https://heroyaman-new-production.up.railway.app/" target="_blank" rel="noopener">Hero Family</a><button id="rf">${t('refresh')}</button><button id="lg">${t('lang')}</button></div></header>
  <section class="stats">
   <a class="stat" href="/#achieve" target="_blank" style="--sc:#D49400"><b>${STAR} ${stars}</b>${t('level')}: ${LEVELS_AR[li]} · ${Object.keys(S.badges||{}).length} ${t('badges')}</a>
   <a class="stat" href="/#progress" target="_blank" style="--sc:var(--accent)"><b>${mins[today]||0}</b>${t('minToday')}</a>
   <a class="stat" href="/#progress" target="_blank" style="--sc:var(--s-math)"><b>${week}</b>${t('minWeek')}</a>
   <a class="stat" href="/#learn" target="_blank" style="--sc:var(--s-bio)"><b>${done} / ${META.topics.length}</b>${t('lessons')}</a>
   <a class="stat" href="/#exam" target="_blank" style="--sc:var(--s-ar)"><b>${avg!==null?avg+'%':'–'}</b>${t('avgWeek')} (${weekEx.length})</a>
   <div class="stat" style="--sc:var(--s-chem)"><b style="font-size:1.25em">${(S.moods||{})[today]?t('moods')[(S.moods||{})[today]]:t('noMood')}</b>${t('mood')} · ${t('frust')}: ${Object.entries(S.frust||{}).filter(([d])=>now-new Date(d+'T12:00:00')<7*864e5).reduce((a,[,n])=>a+n,0)} · ${t('rp')}: ${S.rpDone||0}${(S.tnotes||[]).length?`<div class="small muted ar" style="margin-top:4px">${t('notes')}: ${S.tnotes.map(n=>esc(n.t)).join(' · ')}</div>`:''}${(S.settings?.interests||[]).length?`<div class="small muted ar" style="margin-top:4px">${t('interests')}: ${(S.settings.interests).map(esc).join('، ')}</div>`:''}</div>
   <a class="stat" href="/#review" target="_blank" style="--sc:var(--s-he)"><b>${due}</b>${t('review')} (${t('of')} ${rev.length})</a>
  </section>
  ${pend.length?`<section class="card" style="border-inline-start:5px solid #D49400"><h2>${STAR} ${t('claims')}</h2>${pend.map(c=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="ar"><b>${esc(c.name)}</b> · ${c.cost} ${t('stars')} · <span class="muted small">${new Date(c.ts).toLocaleDateString(loc())}</span></span><button class="btn-p" data-give="${esc(c.id)}">${t('give')}</button></div>`).join('')}</section>`:''}
  ${weak.length?`<section class="card" style="border-inline-start:5px solid var(--bad)"><h2>${t('weak')}</h2><p class="muted small" style="margin:0 0 8px">${t('weakHint')}</p><div class="row">${weak.map(r=>`<a class="chip bad ar" style="text-decoration:none" href="/#exam-${r.x.id}" target="_blank">${esc(r.x.n)}</a>`).join('')}</div></section>`:''}
  <section class="two"><div class="card"><h2>${t('week')}</h2>${bars}</div><div class="card"><h2>${t('scores')}</h2>${chart}<div class="muted small">${t('pink')}</div></div></section>
  ${timeline(E)}${testsCard(S)}
  <section class="card"><div class="row between"><h2>${t('tt')}</h2><a class="go" href="/#timetable" target="_blank">${t('ttEdit')}</a></div><div style="display:grid;gap:6px">${t('days').map((d,i)=>{const a=((S.timetable||{})[i]||[]).map(id=>subj(id)).filter(Boolean);return `<div class="row" style="gap:6px"><b style="min-width:64px">${d}</b>${a.length?a.map(x=>`<span class="chip" style="color:var(${x.c});border-color:var(${x.c})">${sn(x)}</span>`).join(''):'<span class="muted small">—</span>'}</div>`}).join('')}</div></section>
  <section class="card"><div class="row between"><h2>${t('bySubj')}</h2><a class="go" href="/#addtopic" target="_blank" style="font-size:.95em;padding:4px 14px">＋ ${t('addTopic')}</a></div><p class="muted small" style="margin:0 0 10px">${t('addHint')}</p><div style="display:grid;gap:10px">${META.subj.filter(s=>rows.some(r=>r.x.s===s.id)).map(s=>{const ts=rows.filter(r=>r.x.s===s.id),d=ts.filter(r=>r.l).length;const ms=ts.map(r=>r.mp).filter(x=>x!==null);const m=ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):null;return `<div style="--sc:var(${s.c})"><div class="row between small"><a class="lnk" href="/#learn-${s.id}" target="_blank" style="color:var(${s.c});font-weight:700">${sn(s)}</a><span>${d}/${ts.length} ${t('less')}${m!==null?' · '+t('acc')+' '+m+'%':''}</span></div><div class="bar"><i style="width:${Math.round(100*d/ts.length)}%"></i></div></div>`}).join('')}</div></section>
  <section class="card"><h2>${t('all')}</h2><div class="tbl"><table><thead><tr><th>${t('topic')}</th><th>${t('subj')}</th><th>${t('lscore')}</th><th>${t('acc')}</th><th>${t('state')}</th><th>${t('actions')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="ar"><a class="lnk" href="/#lesson-${r.x.id}" target="_blank"><b>${esc(r.x.n)}</b></a></td><td style="color:var(${r.s.c})">${sn(r.s)}</td><td class="num">${r.l?r.l.score+'%':'–'}</td><td class="num">${r.mp!==null?`${r.mp}% <span class="muted small">(${r.m.r}/${r.m.t})</span>`:'–'}</td><td><span class="chip ${r.st[1]}">${r.st[0]}</span></td><td><span class="row" style="gap:4px;flex-wrap:nowrap">${link('lesson-'+r.x.id,t('toLesson'))}${link('exam-'+r.x.id,t('toExam'))}</span></td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>${t('recent')}</h2>${E.length?`<div class="tbl"><table><thead><tr><th>${t('date')}</th><th>${t('type')}</th><th>${t('score')}</th><th>${t('right')}</th><th>${t('time')}</th><th></th></tr></thead><tbody>${E.slice(-12).reverse().map(x=>`<tr><td>${new Date(x.ts).toLocaleString(loc(),{dateStyle:'short',timeStyle:'short'})}</td><td>${(x.mode==='open'?t('openT'):t('types')[x.review?0:x.mode==='exam'?1:2])}</td><td class="num"><b>${x.score}%</b></td><td class="num">${x.right}/${x.n}</td><td class="num">${Math.floor((x.sec||0)/60)}:${String((x.sec||0)%60).padStart(2,'0')}</td><td>${x.d?link('result-'+x.ts,t('seeAns')):''}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${t('noEx')}</p>`}</section>
  <section class="card"><h2>${STAR} ${t('rewards')}</h2><p class="muted small" style="margin:0 0 10px">${t('rwHint')}</p>
   <div id="rwList">${RW.rewards.map((r,i)=>`<div class="rw"><input class="ar" data-rn="${i}" value="${esc(r.name)}" aria-label="${t('rwName')}"><input type="number" min="1" data-rc="${i}" value="${r.cost}" aria-label="${t('rwCost')}"><button data-rd="${i}">${t('del')}</button></div>`).join('')}</div>
   <div class="rw"><input class="ar" id="nn" placeholder="${t('rwName')}"><input type="number" min="1" id="nc" placeholder="${t('rwCost')}"><button id="na">${t('add')}</button></div>
   <div class="row" style="margin-top:8px"><button class="btn-p" id="rs">${t('save')}</button>${RW.rewards.length?'':`<button id="sg">${t('suggest')}</button>`}<span id="rsm" class="muted small"></span></div>
   ${claims.length?`<h2 style="margin-top:16px">${t('claims')}</h2>${claims.slice().reverse().map(c=>`<div class="row between small" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="ar">${esc(c.name)} · ${c.cost}</span><span class="chip ${RW.given.includes(c.id)?'good':'warn'}">${RW.given.includes(c.id)?t('given'):t('pending')}</span></div>`).join('')}`:''}
  </section>
  <p class="muted small">${t('sumApi')} <span dir="ltr">/api/summary?code=…</span></p>`;
  $('rf').onclick=load;$('lg').onclick=()=>setLang(LANG==='he'?'ar':'he');
  const sync=()=>{document.querySelectorAll('[data-rn]').forEach(el=>RW.rewards[+el.dataset.rn].name=el.value.trim());document.querySelectorAll('[data-rc]').forEach(el=>RW.rewards[+el.dataset.rc].cost=Math.max(1,+el.value||1))};
  const saveRW=async()=>{sync();try{let pc='';try{pc=localStorage.getItem('yaman_parent_pcode')||''}catch(_){}if(!pc){pc=(window.prompt(LANG==='he'?'קוד הורה':'رمز الوالد')||'').trim();}let r=await fetch('/api/rewards',{method:'POST',headers:{...hdr(),'x-parent-code':pc,'content-type':'application/json'},body:JSON.stringify(RW)});if(r.status===403){try{localStorage.removeItem('yaman_parent_pcode')}catch(_){}$('rsm')&&($('rsm').textContent=LANG==='he'?'קוד הורה שגוי':'رمز الوالد غير صحيح');return false}if(!r.ok)throw 0;try{localStorage.setItem('yaman_parent_pcode',pc)}catch(_){}$('rsm')&&($('rsm').textContent=t('saved'));return true}catch(e){$('rsm')&&($('rsm').textContent=t('fail'));return false}};
  $('na').onclick=()=>{sync();const n=$('nn').value.trim(),c=+$('nc').value;if(!n||!c)return;RW.rewards.push({id:'r'+Date.now().toString(36),name:n,cost:c});draw()};
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{sync();RW.rewards.splice(+b.dataset.rd,1);draw()});
  $('rs').onclick=saveRW;
  if($('sg'))$('sg').onclick=()=>{RW.rewards=[{id:'r1',name:'اختيار وجبة العشاء',cost:150},{id:'r2',name:'ساعة لعب إضافية',cost:250},{id:'r3',name:'نزهة في نهاية الأسبوع',cost:500},{id:'r4',name:'هدية صغيرة يختارها يمان',cost:900}];draw()};
  document.querySelectorAll('[data-give]').forEach(b=>b.onclick=async()=>{RW.given=[...RW.given,b.dataset.give];if(await saveRW())draw()});
}
document.documentElement.lang=LANG;document.title=t('title');
load();
