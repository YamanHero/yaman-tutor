<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6870">
<title>أتعلم بطريقتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: fixed top bar + two-column workspace (lesson/exam on the right, teacher panel on the left); one predictable structure on every screen. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface2:#F5F8F7; --ink:#15252B; --muted:#56676D; --line:#D3DDDB;
  --accent:#1B6870; --accent-ink:#FFFFFF; --focus:#D99A00;
  --good:#256F45; --good-bg:#E1F2E7; --warn:#8A5A00; --warn-bg:#FFF1D2; --bad:#A83636; --bad-bg:#FAE4E1;
  --s-math:#2D66C4; --s-phys:#7347BF; --s-chem:#0B8282; --s-bio:#3A8538; --s-ar:#B86D00; --s-he:#B83A72; --s-en:#3B55A0;
  --r-a:#2D66C4; --r-b:#C45F00; --r-c:#5E6E74; --r-d:#7347BF; --r-e:#26804D; --r-f:#B83A72;
  --f-body:"Readex Pro","Noto Sans Hebrew",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --f-he:"Noto Sans Hebrew","Readex Pro",system-ui,sans-serif;
  --radius:14px; --base:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171A; --surface:#162125; --surface2:#1B292E; --ink:#E3ECEC; --muted:#9AADB1; --line:#2A3A40;
  --accent:#55B5BE; --accent-ink:#06211F; --focus:#F2C14E;
  --good:#6FCF94; --good-bg:#183326; --warn:#F0C062; --warn-bg:#352A12; --bad:#F08A80; --bad-bg:#3A1C1A;
  --s-math:#6E9CF0; --s-phys:#A688EA; --s-chem:#3CC1C1; --s-bio:#78C46F; --s-ar:#F0A546; --s-he:#EE7AAE; --s-en:#8397E0;
  --r-a:#6E9CF0; --r-b:#F59A4B; --r-c:#A3B2B7; --r-d:#A688EA; --r-e:#6FCF94; --r-f:#EE7AAE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#162125; --surface2:#1B292E; --ink:#E3ECEC; --muted:#9AADB1; --line:#2A3A40;
  --accent:#55B5BE; --accent-ink:#06211F; --focus:#F2C14E;
  --good:#6FCF94; --good-bg:#183326; --warn:#F0C062; --warn-bg:#352A12; --bad:#F08A80; --bad-bg:#3A1C1A;
  --s-math:#6E9CF0; --s-phys:#A688EA; --s-chem:#3CC1C1; --s-bio:#78C46F; --s-ar:#F0A546; --s-he:#EE7AAE; --s-en:#8397E0;
  --r-a:#6E9CF0; --r-b:#F59A4B; --r-c:#A3B2B7; --r-d:#A688EA; --r-e:#6FCF94; --r-f:#EE7AAE;
  color-scheme:dark}
html[data-size="l"]{--base:19px} html[data-size="xl"]{--base:21px}
html{direction:rtl;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
svg{direction:ltr}
*{box-sizing:border-box}
[hidden]{display:none!important}
#tClose{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.7;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.5em 1em;min-height:44px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-ghost{background:transparent}
.ltr{direction:ltr;unicode-bidi:isolate}
.he{font-family:var(--f-he);direction:rtl}
.muted{color:var(--muted)}
.small{font-size:.85em}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:1.35em} h3{font-size:1.08em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand b{font-family:var(--f-display);font-size:1.45em;color:var(--accent);font-weight:700}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border-color:transparent;background:transparent;font-weight:500}
.nav button[aria-current="page"]{background:var(--surface2);border-color:var(--line);color:var(--accent);font-weight:700}
.save-chip{font-size:.75em;padding:2px 10px;border-radius:20px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.wrap{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:30px;font-size:.82em;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.notice{padding:12px 16px;border-radius:12px;background:var(--surface2);line-height:1.75}
.notice.good{background:var(--good-bg);color:var(--ink);border-inline-start:5px solid var(--good)}
.notice.warn{background:var(--warn-bg);color:var(--ink);border-inline-start:5px solid var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--ink);border-inline-start:5px solid var(--bad)}
.bar{height:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sc,var(--accent));border-radius:10px}
/* subjects */
.subjects{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.subj{--sc:var(--accent);text-align:start;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--radius);border:1.5px solid color-mix(in srgb,var(--sc) 35%,var(--line));background:color-mix(in srgb,var(--sc) 9%,var(--surface))}
.subj .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:1.1em;color:var(--surface);background:var(--sc)}
.subj[aria-pressed="true"]{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc)}
.subj b{font-size:1em}
.topic-list{display:grid;gap:8px}
.topic-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;width:100%;padding:12px 14px}
.topic-btn[aria-current="true"]{border-color:var(--sc);background:var(--surface2)}
/* plan */
.plan{grid-template-columns:repeat(3,minmax(0,1fr))}
.plan .card{display:flex;flex-direction:column;gap:8px}
.plan .step-n{font-size:.78em;color:var(--muted);letter-spacing:.02em}
.plan .card{border-top:6px solid var(--pc)}
.pic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,var(--surface))}
.pic svg{width:36px;height:36px}
/* lesson visuals */
.lesson{padding:0;overflow:hidden}
.lesson-head{background:color-mix(in srgb,var(--sc) 15%,var(--surface));border-bottom:3px solid var(--sc);padding:16px 20px}
.lesson-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.lesson-title{display:flex;align-items:center;gap:12px}
.lesson-title .ic{width:46px;height:46px;border-radius:12px;background:var(--sc);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:1.15em;flex:none}
.learn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.bubbles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bubbles li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--sc) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 25%,var(--line));font-size:1.05em;line-height:1.85}
.bubbles li>b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--sc);color:var(--surface);display:grid;place-items:center;font-size:.9em;margin-top:2px}
.bubbles li>span{min-width:0}
.fw{font-weight:600;color:var(--sc);unicode-bidi:isolate}
.fw.he{font-family:var(--f-he)}
.term{font-weight:700;padding:0 5px;border-radius:6px}
.formula-wrap{border-radius:16px;padding:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 22%,var(--surface)),color-mix(in srgb,var(--sc) 6%,var(--surface)))}
.formula-wrap .formula{background:var(--surface)}
.lab{border:2px solid color-mix(in srgb,var(--sc,var(--accent)) 40%,var(--line));background:color-mix(in srgb,var(--sc,var(--accent)) 5%,var(--surface2))}
.lab-head h3{display:flex;align-items:center;gap:8px}
.lab-head h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sc,var(--accent))}
@media (max-width:1180px){.learn-grid{grid-template-columns:minmax(0,1fr)}}
/* lesson */
.stepper{display:flex;gap:6px}
.stepper i{flex:1;height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.stepper i.done{background:var(--good);border-color:var(--good)}
.stepper i.now{background:var(--sc,var(--accent));border-color:var(--sc,var(--accent))}
.formula{direction:ltr;font-size:1.7em;font-weight:600;text-align:center;padding:18px 10px;background:var(--surface2);border-radius:12px;letter-spacing:.02em;overflow-x:auto;line-height:1.6}
.formula.rtl{direction:rtl}
.r{padding:1px 6px;border-radius:7px;margin:0 1px;display:inline-block}
.r-a{color:var(--r-a);background:color-mix(in srgb,var(--r-a) 14%,transparent)}
.r-b{color:var(--r-b);background:color-mix(in srgb,var(--r-b) 14%,transparent)}
.r-c{color:var(--r-c)}
.r-d{color:var(--r-d);background:color-mix(in srgb,var(--r-d) 14%,transparent)}
.r-e{color:var(--r-e);background:color-mix(in srgb,var(--r-e) 14%,transparent)}
.r-f{color:var(--r-f);background:color-mix(in srgb,var(--r-f) 16%,transparent);text-decoration:underline 2px}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:.85em}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.explain{font-size:1.06em;line-height:1.95;max-width:68ch}
.explain p{margin:0 0 .5em}
.opts{display:grid;gap:8px}
.opt{text-align:start;width:100%;padding:12px 16px;font-size:1.02em;display:flex;gap:12px;align-items:center}
.opt .k{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.85em;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--sc,var(--accent));background:color-mix(in srgb,var(--sc,var(--accent)) 10%,var(--surface))}
.opt[aria-pressed="true"] .k{background:var(--sc,var(--accent));color:var(--surface);border-color:var(--sc,var(--accent))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt bdi{unicode-bidi:plaintext}
/* lab */
.lab{border:1.5px dashed var(--line);border-radius:var(--radius);padding:16px;background:var(--surface2);display:flex;flex-direction:column;gap:12px}
.lab-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lab svg{width:100%;height:auto;max-height:300px;display:block;margin:auto}
.lab .ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lab label{display:flex;flex-direction:column;gap:2px;font-size:.9em}
.lab input[type=range]{width:100%;accent-color:var(--accent)}
.lab .out{min-width:0}
.lab .readout{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lab .readout .chip{font-size:.92em;background:var(--surface)}
.svgtxt{fill:var(--ink);font-family:var(--f-body)}
.svgmuted{fill:var(--muted);font-family:var(--f-body)}
.word{font-size:1.25em;padding:8px 14px;border-radius:10px;min-width:70px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.word small{font-size:.6em;color:var(--muted)}
.word.ok{outline:3px solid var(--good)} .word.no{outline:3px solid var(--bad)}
.flip{min-height:150px;width:100%;font-size:1.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-width:2px;border-radius:var(--radius);background:var(--surface)}
.flip .big{font-size:2.1em;font-family:var(--f-he)}
/* exam */
.qnum{display:flex;gap:6px;flex-wrap:wrap}
.qnum button{min-width:40px;min-height:40px;padding:0;border-radius:10px;font-size:.88em;font-variant-numeric:tabular-nums}
.qnum button.ans{background:var(--surface2);border-color:var(--accent)}
.qnum button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnum button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.qtext{font-size:1.22em;line-height:1.8;font-weight:500}
.score{font-family:var(--f-display);font-size:3.6em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.check-list label{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.check-list input{width:20px;height:20px;accent-color:var(--accent)}
.review{display:grid;gap:10px}
.review .item{border:1px solid var(--line);border-radius:12px;padding:14px;border-inline-start:5px solid var(--good)}
.review .item.x{border-inline-start-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.88em}
.tbl{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:14px;border-radius:12px;background:var(--surface2)}
.stat b{display:block;font-size:1.7em;font-variant-numeric:tabular-nums;color:var(--accent)}
/* teacher */
aside#teacher{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.t-head{display:flex;gap:10px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3em;flex:none}
.chat{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1;padding-inline-end:4px}
.msg{padding:10px 12px;border-radius:12px;line-height:1.75;font-size:.95em;max-width:95%;overflow-wrap:anywhere}
.msg.t{background:var(--surface2);border-inline-start:4px solid var(--accent);align-self:flex-start}
.msg.u{background:color-mix(in srgb,var(--accent) 12%,var(--surface));align-self:flex-end}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:.85em;min-height:38px;padding:.3em .8em}
.t-input{display:flex;gap:6px}
.t-input input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:.5em .8em;background:var(--surface)}
#teacherFab{display:none}
/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.breath{width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:3px solid var(--accent);display:grid;place-items:center;font-weight:600;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.72)}50%{transform:scale(1)}}
.field{display:flex;flex-direction:column;gap:6px}
select{border:1.5px solid var(--line);border-radius:12px;padding:.45em .7em;background:var(--surface)}
html[data-motion="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:980px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside#teacher{display:none;position:fixed;inset:auto 0 0 0;top:auto;max-height:78vh;border-radius:18px 18px 0 0;z-index:40;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  aside#teacher.open{display:flex}
  #tClose{display:inline-flex}
  #teacherFab{display:flex;position:fixed;z-index:35;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));align-items:center;gap:8px;border-radius:30px;padding:.6em 1.1em;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  .plan{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.card{padding:15px}.formula{font-size:1.35em}.brand small{display:none}.nav{width:100%}.nav button{flex:1;padding:.4em .4em;font-size:.9em}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>أتعلم بطريقتي</b><small class="muted">مع الأستاذ سامر</small></div>
  <span class="save-chip" id="saveChip">محفوظ على هذا الجهاز</span>
  <nav class="nav" aria-label="الأقسام">
    <button data-nav="home">الرئيسية</button>
    <button data-nav="learn">الدروس</button>
    <button data-nav="exam">امتحانات</button>
    <button data-nav="progress">تقدّمي</button>
    <button data-nav="settings" aria-label="الإعدادات">الإعدادات</button>
  </nav>
</div></header>

<div class="wrap">
  <main id="view" aria-live="polite"></main>
  <aside id="teacher" aria-label="الأستاذ سامر">
    <div class="t-head">
      <div class="avatar" aria-hidden="true">س</div>
      <div style="flex:1;min-width:0"><b>الأستاذ سامر</b><div class="muted small" id="tMode">يجيب على أسئلتك خطوة خطوة</div></div>
      <button class="btn-ghost" id="tClose" aria-label="إغلاق" style="min-height:36px;padding:.2em .7em">✕</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="quick">
      <button data-q="simple">اشرح ببساطة</button>
      <button data-q="hint">تلميح صغير</button>
      <button data-q="example">مثال آخر</button>
      <button data-q="break">أحتاج استراحة</button>
    </div>
    <form class="t-input" id="tForm">
      <input id="tInput" aria-label="اكتب سؤالك للأستاذ سامر" placeholder="اكتب سؤالك هنا…" autocomplete="off">
      <button class="btn-p" type="submit">أرسل</button>

/* ============ STATE & STORAGE ============ */
const LS='yaman_tutor_v4';
const blank=()=>({lessons:{},mastery:{},days:[],gen:{},review:{},minutes:{},settings:{size:'m',motion:'on',rate:0.8,timer:'none'}});
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());
let S=blank(), EXAMS=[];
function adopt(o){if(!o||!o.S)return;S={...blank(),...o.S,settings:{...blank().settings,...(o.S.settings||{})}};EXAMS=Array.isArray(o.E)?o.E:[]}
try{adopt(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){}
let CODE='';try{CODE=localStorage.getItem(LS+'_code')||''}catch(e){}
let ONLINE=false, SAMPLE=null, saving=false, dirty=false, saveTimer=null;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({S,E:EXAMS.slice(-300),t:Date.now()}))}catch(e){}}
async function api(path,opts={}){
  const r=await fetch('/api/'+path,{...opts,headers:{'content-type':'application/json','x-family-code':CODE,...(opts.headers||{})}});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw {code:(j&&j.code)||('http_'+r.status),message:j&&j.message};
  return j;
}
function persist(soon){saveLocal();if(!ONLINE)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,soon?400:4000)}
async function flush(){if(!ONLINE||saving||!dirty)return;saving=true;dirty=false;
  try{await api('state',{method:'POST',body:JSON.stringify({S,E:EXAMS.slice(-300)})});chip('محفوظ في السحابة')}
  catch(e){dirty=true;chip(e.code==='auth'?'رمز العائلة تغيّر':'غير متصل – محفوظ على الجهاز')}
  saving=false;if(dirty&&!saveTimer)saveTimer=setTimeout(flush,15000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty&&ONLINE){try{fetch('/api/state',{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-family-code':CODE},body:JSON.stringify({S,E:EXAMS.slice(-300)})});dirty=false}catch(e){}}});
async function saveExam(x){EXAMS.push(x);persist(true)}
function chip(t){const c=document.getElementById('saveChip');if(c)c.textContent=t}
function markDay(){const d=today();if(!S.days.includes(d)){S.days.push(d);S.days=S.days.slice(-180)}}
async function connect(){
  if(!CODE){askCode();return}
  try{
    const r=await api('state');ONLINE=true;
    const local=(()=>{try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}})();
    if(r.data&&r.data.S&&(!local||!local.t||(r.data.updated||0)>=local.t)){adopt(r.data);saveLocal()}
    else if(local&&local.S){dirty=true;flush()}
    chip('محفوظ في السحابة');applySettings();render();
    api('ask').then(x=>{if(x&&x.ai){SAMPLE=makeSample();updateTeacherMode()}}).catch(()=>{});
  }catch(e){
    if(e.code==='auth'){CODE='';try{localStorage.removeItem(LS+'_code')}catch(_){}askCode('الرمز غير صحيح. جرّب مرة أخرى.');return}
    chip('غير متصل – محفوظ على الجهاز');setTimeout(connect,30000);
  }
}
function askCode(err){
  const o=document.getElementById('overlay');o.hidden=false;
  o.innerHTML=`<form class="card" id="codeForm" role="dialog" aria-modal="true"><div class="avatar" aria-hidden="true">س</div><h2>أهلًا يمان</h2><p class="muted" style="margin:0">اكتب رمز العائلة مرة واحدة فقط على هذا الجهاز.</p><input id="codeIn" autocomplete="off" inputmode="text" aria-label="رمز العائلة" style="width:100%;font-size:1.2em;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:.5em;background:var(--surface)">${err?`<div class="notice warn" style="width:100%">${err}</div>`:''}<button class="btn-p" type="submit" style="width:100%">ادخل</button><button type="button" class="btn-ghost" id="codeSkip">استعمل بدون حفظ في السحابة</button></form>`;
  document.getElementById('codeIn').focus();
  document.getElementById('codeForm').onsubmit=e=>{e.preventDefault();const v=document.getElementById('codeIn').value.trim();if(!v)return;CODE=v;try{localStorage.setItem(LS+'_code',v)}catch(_){}o.hidden=true;connect()};
  document.getElementById('codeSkip').onclick=()=>{o.hidden=true;chip('محفوظ على هذا الجهاز فقط')};
}
function makeSample(){
  const f=async(turns,o={})=>{const r=await api('ask',{method:'POST',signal:o.signal,body:JSON.stringify({messages:typeof turns==='string'?[{role:'user',content:turns}]:turns,max:900})});if(o.onText)o.onText({text:r.text});return {text:r.text}};
  f.json=async(prompt)=>{const r=await api('ask',{method:'POST',body:JSON.stringify({messages:[{role:'user',content:prompt+'\n\nأجب بـ JSON فقط، بدون أي نص قبله أو بعده.'}],max:2500})});
    const t=r.text||'';const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);const body=m?m[1]:t.slice(t.indexOf('['),t.lastIndexOf(']')+1);try{return JSON.parse(body)}catch(e){throw {code:'invalid_json'}}};
  return f;
}

/* spaced review */
const DAY=864e5, GAPS=[1,3,7,14];
const qkey=q=>{let h=0;const str=q.q+'|'+[...q.o].sort().join('|');for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return 'k'+(h>>>0).toString(36)};
const tomorrow=()=>{const d=new Date();d.setHours(4,0,0,0);return d.getTime()+DAY};
function addReview(q){S.review[qkey(q)]={q:{q:q.q,o:q.o,c:q.c,w:q.w||'',tid:q.tid},box:0,due:tomorrow()}}
function reviewResult(q,ok){const k=qkey(q),r=S.review[k];if(!r){if(!ok)addReview(q);return}
  if(ok){r.box++;if(r.box>=GAPS.length)delete S.review[k];else{const d=new Date();d.setHours(4,0,0,0);r.due=d.getTime()+GAPS[r.box]*DAY}}else{r.box=0;r.due=tomorrow()}}
const dueReviews=()=>Object.values(S.review).filter(r=>r.due<=Date.now());

function paint(v,t){
  if(!v)return'';
  if(v.includes('[')&&/\[[a-f]:/.test(v))return esc(v).replace(/\[([a-f]):([^\]]+)\]/g,(m,r,x)=>`<span class="r r-${r}">${x}</span>`);
  if(!t.auto)return esc(v);
  let out='';const re=/([A-Za-z]+)|([0-9.,/²₂⁺⁻⁰]+)|([=+−×÷()<>≤→←\-])|([^A-Za-z0-9.,/²₂⁺⁻⁰=+−×÷()<>≤→←\-]+)/g;let m;
  while((m=re.exec(v))){if(m[1])out+=`<span class="r r-a">${esc(m[1])}</span>`;else if(m[2])out+=`<span class="r r-b">${esc(m[2])}</span>`;else if(m[3])out+=`<span class="r r-c">${esc(m[3])}</span>`;else out+=esc(m[4])}
  return out;
}
function legend(v,t){
  if(!v)return'';const used=new Set();
  if(/\[[a-f]:/.test(v))v.replace(/\[([a-f]):/g,(m,r)=>used.add(r));else if(t.auto){if(/[A-Za-z]/.test(v))used.add('a');if(/[0-9]/.test(v))used.add('b');if(/[=+−×÷]/.test(v))used.add('c')}
  const it=[...used].filter(r=>t.leg[r]).map(r=>`<span><i style="background:var(--r-${r})"></i>${esc(t.leg[r])}</span>`);
  return it.length?`<div class="legend">${it.join('')}</div>`:'';

const TERMS={'مبتدأ':'a','فاعل':'a','الفاعل':'a','اسم كان':'a','اسم إنّ':'a','خبر':'e','الخبر':'e','خبر كان':'e','خبر إنّ':'e','مفعول به':'b','المفعول به':'b','فعل':'d','الضمّة':'a','الفتحة':'b','مرفوع':'a','مرفوعة':'a','منصوب':'b','ترفع':'a','تنصب':'b','للمذكّر':'a','للمؤنّث':'f','المذكّر':'a','المؤنّث':'f'};

  else if(sid==='ar'){const keys=Object.keys(TERMS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));re=new RegExp('(?<![\\u0621-\\u064A])('+keys.join('|')+')(?![\\u0621-\\u064A])','g')}
  else re=/([A-Za-z]{1,4}[0-9]*)/g;
  let out='',last=0,m;
  while((m=re.exec(text))){out+=esc(text.slice(last,m.index));const w=m[0];
    if(t.auto)out+=`<span class="ltr" dir="ltr" style="white-space:nowrap">${paint(w,{auto:1})}</span>`;

}

async function genQuestions(id){

لا تكرّر هذه الأسئلة الموجودة: ${old}
أجب بمصفوفة JSON فقط بهذا الشكل (c هو رقم الخيار الصحيح من 0 إلى 3):
${ex}`,{modelTier:'default'});
    const ok=(Array.isArray(arr)?arr:[]).filter(q=>q&&typeof q.q==='string'&&Array.isArray(q.o)&&q.o.length===4&&q.o.every(x=>typeof x==='string')&&Number.isInteger(q.c)&&q.c>=0&&q.c<4).map(q=>({q:q.q.slice(0,300),o:q.o.map(x=>x.slice(0,120)),c:q.c,w:String(q.w||'').slice(0,300),gen:1}));

}
function startExam(cfg){

  const by={};pool.forEach(q=>(by[q.tid]=by[q.tid]||[]).push(q));const qs=[];let k=0;const keys=Object.keys(by);
  while(qs.length<Math.min(cfg.n,pool.length)){const arr=by[keys[k%keys.length]];if(arr.length)qs.push(arr.shift());k++}
  E={...cfg,qs:qs.map(q=>{const ord=shuffle([0,1,2,3].slice(0,q.o.length));return {...q,o:ord.map(i=>q.o[i]),c:ord.indexOf(q.c)}}),i:0,ans:Array(qs.length).fill(null),seen:Array(qs.length).fill(false),flag:Array(qs.length).fill(false),start:Date.now(),done:false};

  $('xEnd').onclick=()=>{const un=E.ans.filter(a=>a===null).length,fl=E.flag.filter(Boolean).length;
    confirmBox(un||fl?`${un?`لم تجب على ${un} ${un===1?'سؤال':'أسئلة'}. `:''}${fl?`علّمت ${fl} للمراجعة. `:''}هل تريد التسليم الآن؟`:'أجبت على كل الأسئلة. هل تريد التسليم؟','نعم، سلّم','ارجع للأسئلة',finishExam)};
  clearInterval(tick);if(E.timer!=='none'){const upd=()=>{const el=$('clock');if(!el||!E){clearInterval(tick);return}const sec=Math.floor((Date.now()-E.start)/1000);if(E.timer==='up')el.textContent='مرّ '+mmss(sec);else{const lim=Math.round(E.qs.length*90),left=lim-sec;el.textContent=left>=0?'بقي '+mmss(left):'انتهى الوقت المقترح';const tn=$('timeNote');if(left<0&&tn&&!tn.innerHTML)tn.innerHTML='<div class="notice" style="margin-top:12px">انتهى الوقت المقترح. لا بأس، أكمل بهدوء ثم سلّم.</div>'}};upd();tick=setInterval(upd,1000)}
}
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function finishExam(){
  clearInterval(tick);const n=E.qs.length;let right=0;const per={};
  E.qs.forEach((q,i)=>{const ok=E.ans[i]===q.c;reviewResult(q,ok);if(ok)right++;(per[q.tid]=per[q.tid]||[0,0]);per[q.tid][1]++;if(ok)per[q.tid][0]++});
  const score=Math.round(100*right/n);
  for(const [id,[r,t]] of Object.entries(per)){const m=S.mastery[id]||{r:0,t:0};S.mastery[id]={r:m.r+r,t:m.t+t}}
  const rec={ts:Date.now(),score,right,n,mode:E.mode,review:!!E.review,sec:Math.round((Date.now()-E.start)/1000),topics:per};
  E.done=true;lastReview={E,rec};saveExam(rec);E=null;go('examres');
}
function vExamRes(v){
  if(!lastReview){go('exam');return}const {E:X,rec}=lastReview;
  const msg=rec.score>=90?'نتيجة ممتازة. أنت تفهم هذه المواضيع جيدًا.':rec.score>=75?'نتيجة جيدة جدًا. بقي قليل من المراجعة.':rec.score>=55?'نتيجة جيدة. راجع الأسئلة الخاطئة وجرّب مرة أخرى.':'هذه بداية. كل مراجعة تجعلك أقوى. نبدأ من الأسئلة الخاطئة.';
  const wrong=X.qs.map((q,i)=>({q,i,a:X.ans[i]})).filter(x=>x.a!==x.q.c);
  v.innerHTML=`<section class="card"><h2>نتيجة الامتحان</h2>
   <div class="row" style="gap:22px;margin:14px 0"><div class="score">${rec.score}%</div><div><b>${rec.right} من ${rec.n} إجابات صحيحة</b><div class="muted">الوقت: ${mmss(rec.sec)}</div></div></div>
   <div class="notice ${rec.score>=75?'good':'warn'}">${msg}</div>
   <h3 style="margin-top:18px">حسب الموضوع</h3><div class="grid" style="margin-top:8px">${Object.entries(rec.topics).map(([id,[r,t]])=>{const p=Math.round(100*r/t),tp=topic(id);return `<div style="--sc:var(${subj(tp.s).c})"><div class="row between small"><span>${esc(tp.n)}</span><span class="num">${r} / ${t}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
   <div class="row" style="margin-top:16px">${wrong.length?'<button class="btn-p" id="rRetry">تدرّب على الأسئلة الخاطئة</button>':''}<button id="rNew">امتحان جديد</button><button id="rProg" class="btn-ghost">شاهد تقدّمي</button></div></section>
  <section class="card"><h3>مراجعة الإجابات</h3><div class="review" style="margin-top:10px">${X.qs.map((q,i)=>{const a=X.ans[i],ok=a===q.c;return `<div class="item ${ok?'':'x'}"><div class="row between"><b>${i+1}. <bdi>${esc(q.q)}</bdi></b><span class="chip ${ok?'good':'bad'}">${ok?'صحيح':a===null?'بدون إجابة':'خطأ'}</span></div>
   ${!ok&&a!==null?`<div class="small" style="margin-top:6px">إجابتك: <bdi>${esc(q.o[a])}</bdi></div>`:''}<div class="small" style="margin-top:4px">الإجابة الصحيحة: <b><bdi>${esc(q.o[q.c])}</bdi></b></div>${q.w?`<div class="muted small" style="margin-top:4px">${esc(q.w)}</div>`:''}</div>`}).join('')}</div></section>`;
  if($('rRetry'))$('rRetry').onclick=()=>{const qs=wrong.map(x=>x.q);E={ids:[],n:qs.length,mode:'practice',timer:'none',qs:shuffle(qs),i:0,ans:Array(qs.length).fill(null),seen:Array(qs.length).fill(false),flag:Array(qs.length).fill(false),start:Date.now(),done:false};go('examrun')};
  $('rNew').onclick=()=>go('exam');$('rProg').onclick=()=>go('progress');
}

/* ============ PROGRESS ============ */
function vProgress(v){
  const doneN=T.filter(t=>S.lessons[t.id]?.done).length,ex=EXAMS.slice(-12);
  const avg=EXAMS.length?Math.round(EXAMS.reduce((a,b)=>a+b.score,0)/EXAMS.length):null;
  const streak=(()=>{let n=0;const d=new Date();for(;;){const k=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(d);if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else break}return n})();
  let chart='<p class="muted">بعد أول امتحان ستظهر هنا نتائجك على شكل رسم.</p>';
  if(ex.length){const W=600,H=220,pl=40,pr=16,pt=16,pb=34,iw=W-pl-pr,ih=H-pt-pb;const X=i=>pl+(ex.length===1?iw/2:i*iw/(ex.length-1)),Y=s=>pt+ih-(s/100)*ih;
   const grid=[0,50,100].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(g)}" y2="${Y(g)}" style="stroke:var(--line)"/><text x="${pl-8}" y="${Y(g)+4}" font-size="12" text-anchor="end" class="svgmuted">${g}</text>`).join('');
   const pts=ex.map((e,i)=>`${X(i)},${Y(e.score)}`).join(' ');
   chart=`<div class="tbl"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto" role="img" aria-label="علامات آخر الامتحانات">${grid}<polygon points="${X(0)},${Y(0)} ${pts} ${X(ex.length-1)},${Y(0)}" style="fill:color-mix(in srgb,var(--accent) 12%,transparent)"/><polyline points="${pts}" style="fill:none;stroke:var(--accent)" stroke-width="3"/>${ex.map((e,i)=>`<circle cx="${X(i)}" cy="${Y(e.score)}" r="${i===ex.length-1?6:4}" style="fill:var(--accent)"/><text x="${X(i)}" y="${Y(e.score)-10}" font-size="12" text-anchor="middle" class="svgtxt">${e.score}</text><text x="${X(i)}" y="${H-12}" font-size="11" text-anchor="middle" class="svgmuted">${new Date(e.ts).toLocaleDateString('ar',{day:'numeric',month:'numeric'})}</text>`).join('')}</svg></div>`}
  v.innerHTML=`<section class="card"><h2>تقدّمي</h2><div class="grid stats" style="margin-top:12px">
   <div class="stat"><b>${doneN} / ${T.length}</b>دروس مكتملة</div><div class="stat"><b>${EXAMS.length}</b>امتحانات</div><div class="stat"><b>${avg!==null?avg+'%':'–'}</b>معدّل الامتحانات</div><div class="stat"><b>${streak}</b>${streak===1?'يوم تعلّم متتالٍ':'أيام تعلّم متتالية'}</div><div class="stat"><b>${Object.keys(S.review).length}</b>أسئلة في المراجعة (${dueReviews().length} اليوم)</div><div class="stat"><b>${S.minutes[today()]||0}</b>دقائق تعلّم اليوم</div></div></section>
  <section class="card"><h3 style="margin-bottom:8px">علامات آخر الامتحانات</h3>${chart}</section>
  <section class="card"><h3 style="margin-bottom:8px">المواد</h3><div class="grid">${SUBJ.map(s=>{const p=subjProgress(s.id);const ms=T.filter(t=>t.s===s.id).map(t=>mast(t.id)).filter(x=>x!==null);const m=ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):null;return `<div style="--sc:var(${s.c})"><div class="row between small"><b style="color:var(${s.c})">${s.n}</b><span>${p.done}/${p.total} دروس${m!==null?' · امتحانات '+m+'%':''}</span></div><div class="bar"><i style="width:${p.pct}%"></i></div></div>`}).join('')}</div></section>
  <section class="card"><h3 style="margin-bottom:8px">كل المواضيع</h3><div class="tbl"><table><thead><tr><th>الموضوع</th><th>المادة</th><th>علامة الدرس</th><th>دقّة الامتحانات</th><th>الحالة</th><th></th></tr></thead><tbody>
   ${T.map(t=>{const l=lessonPct(t.id),m=mast(t.id),mt=S.mastery[t.id];const st=l===null?['لم يبدأ','']:m===null?['تعلّم الدرس','']:m>=80?['متمكّن','good']:m>=60?['في الطريق','warn']:['يحتاج مراجعة','bad'];
    return `<tr><td><b>${esc(t.n)}</b></td><td style="color:var(${subj(t.s).c})">${subj(t.s).n}</td><td class="num">${l!==null?l+'%':'–'}</td><td class="num">${m!==null?`${m}% <span class="muted small">(${mt.r}/${mt.t})</span>`:'–'}</td><td><span class="chip ${st[1]}">${st[0]}</span></td><td><button class="btn-ghost small" data-t="${t.id}" style="min-height:36px">${l===null?'ابدأ':'راجع'}</button></td></tr>`}).join('')}</tbody></table></div></section>`;
  v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startLesson(b.dataset.t));
}

/* ============ SETTINGS ============ */
function applySettings(){const st=S.settings;document.documentElement.dataset.size=st.size;document.documentElement.dataset.motion=st.motion}
function vSettings(v){
  const st=S.settings,seg=(k,arr)=>`<div class="seg">${arr.map(([val,l])=>`<button data-k="${k}" data-v="${val}" aria-pressed="${String(st[k])===String(val)}">${l}</button>`).join('')}</div>`;
  v.innerHTML=`<section class="card grid" style="gap:18px"><h2>الإعدادات</h2>
   <div class="field"><b>حجم الخط</b>${seg('size',[['m','عادي'],['l','كبير'],['xl','كبير جدًا']])}</div>
   <div class="field"><b>الحركة على الشاشة</b>${seg('motion',[['on','عادية'],['off','بدون حركة']])}<span class="muted small">"بدون حركة" يوقف كل الرسوم المتحركة.</span></div>
   <div class="field"><b>سرعة القراءة الصوتية</b>${seg('rate',[[0.6,'بطيئة'],[0.8,'متوسطة'],[1,'عادية']])}<button style="align-self:start" id="sTest">جرّب الصوت</button></div>
   <div class="field"><b>أين تُحفظ النتائج؟</b><p class="muted small" style="margin:0">${ONLINE?'النتائج محفوظة في السحابة، وتظهر على كل جهاز تُكتب فيه رمز العائلة. والدك يرى ملخّص التقدّم في صفحة الوالدين.':'النتائج محفوظة في هذا المتصفح فقط.'}</p><button style="align-self:start" id="sCode">${ONLINE?'غيّر رمز العائلة على هذا الجهاز':'ادخل رمز العائلة'}</button></div>
   <div class="field"><b>البدء من جديد</b><p class="muted small" style="margin:0">يمسح كل علامات الدروس والامتحانات. لا يمكن التراجع.</p><button id="sReset" style="align-self:start;color:var(--bad);border-color:var(--bad)">امسح كل التقدّم</button></div></section>`;
  v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;st[k]=k==='rate'?+b.dataset.v:b.dataset.v;applySettings();persist();render()});
  $('sCode').onclick=()=>{CODE='';ONLINE=false;try{localStorage.removeItem(LS+'_code')}catch(e){}askCode()};
  $('sTest').onclick=()=>speak('مرحبًا يا يمان. هكذا أقرأ لك الشرح.');
  $('sReset').onclick=()=>confirmBox('هل أنت متأكد؟ ستُمسح كل علامات الدروس والامتحانات.','نعم، امسح','لا، ارجع',async()=>{const keep=S.settings;S={...blank(),settings:keep};EXAMS=[];persist(true);go('home')});
}

/* ============ OVERLAYS ============ */
function confirmBox(text,yes,no,onYes){const o=$('overlay');o.hidden=false;o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><p class="qtext" style="margin:0">${esc(text)}</p><div class="row" style="justify-content:center"><button class="btn-p" id="cYes">${esc(yes)}</button><button id="cNo">${esc(no)}</button></div></div>`;$('cNo').onclick=()=>{o.hidden=true};$('cYes').onclick=()=>{o.hidden=true;onYes()};$('cNo').focus()}
let breakTimer=null;
function openBreak(){const o=$('overlay');o.hidden=false;let sec=120;
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>استراحة</h2><div class="breath" id="bc">تنفّس</div><p class="muted" id="bt" style="margin:0">عندما تكبر الدائرة: خذ نفسًا من الأنف. عندما تصغر: أخرج النفس ببطء.</p><div class="chip num" id="bs">2:00</div><button class="btn-p" id="bEnd">أنا جاهز، نرجع</button></div>`;
  clearInterval(breakTimer);breakTimer=setInterval(()=>{sec--;const el=$('bs');if(!el){clearInterval(breakTimer);return}el.textContent=sec>0?mmss(sec):'انتهت الاستراحة';const bc=$('bc');if(bc)bc.textContent=(sec%8)>=4?'شهيق':'زفير';if(sec<=0)clearInterval(breakTimer)},1000);
  $('bEnd').onclick=()=>{clearInterval(breakTimer);o.hidden=true;teacherSay('أهلًا بعودتك. نكمل من حيث توقفنا، بهدوء.')};$('bEnd').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden){clearInterval(breakTimer);$('overlay').hidden=true}});

/* ============ TEACHER ============ */
const CHAT=[];let tAbort=null,lastT='';
function addMsg(role,text){CHAT.push({role,text});drawChat()}
function fmtMsg(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function drawChat(){const c=$('chat');c.innerHTML=CHAT.map(m=>`<div class="msg ${m.role==='user'?'u':'t'}">${fmtMsg(m.text)}</div>`).join('');c.scrollTop=c.scrollHeight}
function teacherSay(t){lastT=t;addMsg('assistant',t)}
function toastT(t){teacherSay(t)}
function updateTeacherMode(){const m=$('tMode');if(!m)return;m.textContent=VIEW==='examrun'&&E&&E.mode==='exam'?'أثناء الامتحان: أشرح المفاهيم فقط ولا أعطي إجابات':SAMPLE?'معلّم ذكي: اسألني أي سؤال':'إجابات جاهزة من الدرس (المعلّم الذكي غير مفعّل)'}
function context(){
  if(VIEW==='lesson'&&L&&!L.finished){const t=topic(L.tid),st=t.steps[L.step];return `يمان الآن في درس "${t.n}" (مادة ${subj(t.s).n})، الخطوة ${L.step+1}: "${st.t}".\nالشرح في الخطوة: ${st.x}\nسؤال التمرين: ${st.q}\nالخيارات: ${st.o.join(' / ')}\nللمعلّم فقط: الإجابة الصحيحة "${st.o[st.c]}". لا تكشفها مباشرة؛ أعطِ تلميحًا أولًا. اكشفها فقط إذا طلب يمان الحل صراحة بعد أن حاول.`}
  if(VIEW==='examrun'&&E){const q=E.qs[E.i],t=topic(q.tid);return E.mode==='exam'?`يمان الآن في امتحان تجريبي في موضوع "${t.n}". ممنوع أن تعطي الإجابة أو تلميحًا يكشفها. يمكنك فقط تهدئته وشرح المفهوم العام بكلمات عامة.`:`يمان يتدرّب على سؤال في موضوع "${t.n}": ${q.q} (الخيارات: ${q.o.join(' / ')}). للمعلّم فقط: الصحيحة "${q.o[q.c]}". أعطِ تلميحًا أولًا ولا تكشف الحل إلا إذا طلبه بعد محاولة.`}
  return 'يمان في الصفحة الرئيسية للتطبيق. المواد: '+SUBJ.map(s=>s.n).join('، ')+'.';
}
const SYS=`أنت "الأستاذ سامر"، معلّم صبور وهادئ لطالب اسمه يمان، في الصف العاشر أو الحادي عشر في مدرسة عربية في إسرائيل. يمان على طيف التوحّد.
قواعد الكتابة:
- اكتب بالعربية الفصحى البسيطة. جمل قصيرة وواضحة وحرفية. لا تعابير مجازية ولا سخرية ولا مبالغة.
- قسّم الشرح إلى خطوات مرقّمة قصيرة (من 2 إلى 5 خطوات).
- استعمل أمثلة ملموسة من الحياة اليومية.
- ابدأ بما يعرفه يمان، ثم أضف فكرة جديدة واحدة فقط في كل مرة.
- عند الخطأ: قل أن الخطأ طبيعي، ثم وضّح الخطوة التالية.
- لا تكتب أكثر من 120 كلمة إلا إذا طلب يمان شرحًا أطول.
- الرياضيات والرموز اكتبها بشكل بسيط مثل x² و 3x + 2 = 8.
- إذا كان يمان متعبًا أو متوتّرًا، اقترح استراحة قصيرة بلطف.
- إذا سأل عن شيء خارج الدراسة، أجب باختصار ولطف ثم أرجعه للدرس.`;
function offline(kind){
  const st=VIEW==='lesson'&&L&&!L.finished?topic(L.tid).steps[L.step]:null;
  if(kind==='hint')return st?st.h:'افتح درسًا أولًا، وأنا أعطيك تلميحًا عن السؤال.';
  if(kind==='simple')return st?'نأخذ الفكرة خطوة خطوة:\n'+st.x:'اختر درسًا، وأنا أشرح لك خطوة خطوة.';
  if(kind==='example')return st?'انظر إلى المختبر تحت الشرح وجرّب بيدك. ثم اقرأ المثال: '+(st.w||st.h):'اختر درسًا أولًا.';
  return 'أنا هنا. يمكنك أن تطلب: اشرح ببساطة، تلميح صغير، أو مثال آخر.';
}
async function ask(text,kind){
  addMsg('user',text);
  if(!SAMPLE){teacherSay(offline(kind));return}
  if(tAbort)tAbort.abort();tAbort=new AbortController();
  CHAT.push({role:'assistant',text:'…'});drawChat();const idx=CHAT.length-1;
  const hist=CHAT.slice(0,idx-1).filter(m=>m.text&&m.text!=='…').slice(-8);
  const turns=[];for(const m of hist){const r=m.role==='user'?'user':'assistant';if(!turns.length&&r==='assistant')continue;if(turns.length&&turns.at(-1).role===r)turns.at(-1).content+='\n'+m.text;else turns.push({role:r,content:m.text})}
  const final=SYS+'\n\nالسياق الآن:\n'+context()+'\n\nرسالة يمان: '+text;
  if(turns.length&&turns.at(-1).role==='user')turns.at(-1).content+='\n\n'+final;else turns.push({role:'user',content:final});
  try{const r=await SAMPLE(turns,{signal:tAbort.signal,cache:false,modelTier:'default',onText:({text})=>{CHAT[idx].text=text||'…';drawChat()}});CHAT[idx].text=r.text;lastT=r.text;drawChat()}
  catch(e){if(e&&(e.code==='aborted'||e.name==='AbortError'))return;CHAT[idx].text=e&&e.code==='rate_limited'?'أسئلة كثيرة الآن. انتظر قليلًا ثم اسأل مرة أخرى.':e&&e.code==='not_granted'?'لم يُسمح لي بالإجابة الذكية هنا. هذا جواب من الدرس:\n'+offline(kind):'لم أستطع الإجابة الآن. هذا جواب من الدرس:\n'+offline(kind);drawChat()}
}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=b.dataset.q;if(k==='break'){openBreak();return}ask({simple:'اشرح لي هذه الخطوة ببساطة أكثر.',hint:'أعطني تلميحًا صغيرًا بدون الحل.',example:'أعطني مثالًا آخر مشابهًا.'}[k],k)});
$('tForm').onsubmit=e=>{e.preventDefault();const v=$('tInput').value.trim();if(!v)return;$('tInput').value='';const k=/تلميح|مساعدة|مش فاهم|صعب/.test(v)?'hint':/مثال/.test(v)?'example':'simple';if(/استراحة|تعبت|تعبان/.test(v)&&!SAMPLE){openBreak();return}ask(v,k)};
$('tSpeak').onclick=()=>speak(lastT||'مرحبًا يمان');$('tStop').onclick=stopSpeak;
$('teacherFab').onclick=()=>{$('teacher').classList.add('open');$('tInput').focus()};$('tClose').onclick=()=>$('teacher').classList.remove('open');

/* ============ BOOT ============ */
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');
applySettings();
teacherSay('أهلًا يمان. أنا الأستاذ سامر. اختر درسًا، ونمشي معًا خطوة خطوة. إذا احتجت شيئًا اضغط على أحد الأزرار تحت.');
render();
connect();
</script>
