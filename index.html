<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>أتعلم بطريقتي</title>
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;700&family=Noto+Sans+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: fixed top bar + two-column workspace (lesson/exam on the right, teacher panel on the left); one predictable structure on every screen. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface2:#F5F8F7; --ink:#15252B; --muted:#56676D; --line:#D3DDDB;
  --accent:#1B6870; --accent-ink:#FFFFFF; --focus:#D99A00; --gold:#D49400;
  --good:#256F45; --good-bg:#E1F2E7; --warn:#8A5A00; --warn-bg:#FFF1D2; --bad:#A83636; --bad-bg:#FAE4E1;
  --s-math:#2D66C4; --s-phys:#7347BF; --s-chem:#0B8282; --s-bio:#3A8538; --s-ar:#B86D00; --s-he:#B83A72; --s-en:#3B55A0; --s-hist:#8A5A2B; --s-civ:#1F7A8C; --s-rel:#2E7D32; --s-geo:#5F7F1A; --s-cs:#4A4E69; --s-soc:#C2410C;
  --r-a:#2D66C4; --r-b:#C45F00; --r-c:#5E6E74; --r-d:#7347BF; --r-e:#26804D; --r-f:#B83A72;
  --f-body:"Readex Pro","Noto Sans Hebrew",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --f-he:"Noto Sans Hebrew","Readex Pro",system-ui,sans-serif;
  --radius:14px; --base:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171A; --surface:#162125; --surface2:#1B292E; --ink:#E3ECEC; --muted:#9AADB1; --line:#2A3A40;
  --accent:#55B5BE; --accent-ink:#06211F; --focus:#F2C14E; --gold:#F2C14E;
  --good:#6FCF94; --good-bg:#183326; --warn:#F0C062; --warn-bg:#352A12; --bad:#F08A80; --bad-bg:#3A1C1A;
  --s-math:#6E9CF0; --s-phys:#A688EA; --s-chem:#3CC1C1; --s-bio:#78C46F; --s-ar:#F0A546; --s-he:#EE7AAE; --s-en:#8397E0; --s-hist:#D9A06B; --s-civ:#5CC3D6; --s-rel:#7DD07F; --s-geo:#B5D45C; --s-cs:#A9ADC9; --s-soc:#FB923C;
  --r-a:#6E9CF0; --r-b:#F59A4B; --r-c:#A3B2B7; --r-d:#A688EA; --r-e:#6FCF94; --r-f:#EE7AAE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#162125; --surface2:#1B292E; --ink:#E3ECEC; --muted:#9AADB1; --line:#2A3A40;
  --accent:#55B5BE; --accent-ink:#06211F; --focus:#F2C14E; --gold:#F2C14E;
  --good:#6FCF94; --good-bg:#183326; --warn:#F0C062; --warn-bg:#352A12; --bad:#F08A80; --bad-bg:#3A1C1A;
  --s-math:#6E9CF0; --s-phys:#A688EA; --s-chem:#3CC1C1; --s-bio:#78C46F; --s-ar:#F0A546; --s-he:#EE7AAE; --s-en:#8397E0; --s-hist:#D9A06B; --s-civ:#5CC3D6; --s-rel:#7DD07F; --s-geo:#B5D45C; --s-cs:#A9ADC9; --s-soc:#FB923C;
  --r-a:#6E9CF0; --r-b:#F59A4B; --r-c:#A3B2B7; --r-d:#A688EA; --r-e:#6FCF94; --r-f:#EE7AAE;
  color-scheme:dark}
html[data-size="l"]{--base:19px} html[data-size="xl"]{--base:21px}
html{direction:rtl;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
svg{direction:ltr}
*{box-sizing:border-box}
[hidden]{display:none!important}
#tClose{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.7;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.5em 1em;min-height:44px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-ghost{background:transparent}
.ltr{direction:ltr;unicode-bidi:isolate}
.he{font-family:var(--f-he);direction:rtl}
.muted{color:var(--muted)}
.small{font-size:.85em}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:1.35em} h3{font-size:1.08em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand b{font-family:var(--f-display);font-size:1.45em;color:var(--accent);font-weight:700}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border-color:transparent;background:transparent;font-weight:500}
.nav button[aria-current="page"]{background:var(--surface2);border-color:var(--line);color:var(--accent);font-weight:700}
.save-chip{white-space:nowrap;font-size:.75em;padding:2px 10px;border-radius:20px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.wrap{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.spw{display:inline-flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:12px;font-weight:700;font-size:1.15em;border:2px solid transparent;background:none}.spw small{font-weight:400;font-size:.62em;opacity:.85}.spw.ok{background:rgba(46,160,90,.16);border-color:rgba(46,160,90,.55)}.spw.bad{background:rgba(220,60,60,.14);border-color:rgba(220,60,60,.55)}.spw.extra{background:rgba(150,150,150,.14);border-color:rgba(150,150,150,.4)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:30px;font-size:.82em;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.notice{padding:12px 16px;border-radius:12px;background:var(--surface2);line-height:1.75}
.notice.good{background:var(--good-bg);color:var(--ink);border-inline-start:5px solid var(--good)}
.notice.warn{background:var(--warn-bg);color:var(--ink);border-inline-start:5px solid var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--ink);border-inline-start:5px solid var(--bad)}
.bar{height:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sc,var(--accent));border-radius:10px}
/* subjects */
.subjects{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.subj{--sc:var(--accent);text-align:start;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--radius);border:1.5px solid color-mix(in srgb,var(--sc) 35%,var(--line));background:color-mix(in srgb,var(--sc) 9%,var(--surface))}
.subj .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:1.1em;color:var(--surface);background:var(--sc)}
.subj[aria-pressed="true"]{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc)}
.subj b{font-size:1em}
.topic-list{display:grid;gap:8px}
.topic-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;width:100%;padding:12px 14px}
.topic-btn[aria-current="true"]{border-color:var(--sc);background:var(--surface2)}
/* plan */
.plan{grid-template-columns:repeat(3,minmax(0,1fr))}
.plan .card{display:flex;flex-direction:column;gap:8px}
.plan .step-n{font-size:.78em;color:var(--muted);letter-spacing:.02em}
.plan .card{border-top:6px solid var(--pc)}
.pic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,var(--surface))}
.pic svg{width:36px;height:36px}
/* lesson visuals */
.lesson{padding:0;overflow:hidden}
.lesson-head{background:color-mix(in srgb,var(--sc) 15%,var(--surface));border-bottom:3px solid var(--sc);padding:16px 20px}
.lesson-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.lesson-title{display:flex;align-items:center;gap:12px}
.lesson-title .ic{width:46px;height:46px;border-radius:12px;background:var(--sc);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:1.15em;flex:none}
.learn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.bubbles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bubbles li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--sc) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 25%,var(--line));font-size:1.05em;line-height:1.85}
.bubbles li>b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--sc);color:var(--surface);display:grid;place-items:center;font-size:.9em;margin-top:2px}
.bubbles li>span{min-width:0}
.bubbles .r,.qtext .r{padding:0 3px;margin:0}
.fw{font-weight:600;color:var(--sc);unicode-bidi:isolate}
.fw.he{font-family:var(--f-he)}
.term{font-weight:700;padding:0 5px;border-radius:6px}
.formula-wrap{border-radius:16px;padding:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 22%,var(--surface)),color-mix(in srgb,var(--sc) 6%,var(--surface)))}
.formula-wrap .formula{background:var(--surface)}
.lab{border:2px solid color-mix(in srgb,var(--sc,var(--accent)) 40%,var(--line));background:color-mix(in srgb,var(--sc,var(--accent)) 5%,var(--surface2))}
.lab-head h3{display:flex;align-items:center;gap:8px}
.lab-head h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sc,var(--accent))}
@media (max-width:1180px){.learn-grid{grid-template-columns:minmax(0,1fr)}}
/* lesson */
.stepper{display:flex;gap:6px}
.stepper i{flex:1;height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.stepper i.done{background:var(--good);border-color:var(--good)}
.stepper i.now{background:var(--sc,var(--accent));border-color:var(--sc,var(--accent))}
.formula{direction:ltr;font-size:1.7em;font-weight:600;text-align:center;padding:18px 10px;background:var(--surface2);border-radius:12px;letter-spacing:.02em;overflow-x:auto;line-height:1.6}
.formula.rtl{direction:rtl}
.r{padding:1px 6px;border-radius:7px;margin:0 1px;display:inline-block}
.r-a{color:var(--r-a);background:color-mix(in srgb,var(--r-a) 14%,transparent)}
.r-b{color:var(--r-b);background:color-mix(in srgb,var(--r-b) 14%,transparent)}
.r-c{color:var(--r-c)}
.r-d{color:var(--r-d);background:color-mix(in srgb,var(--r-d) 14%,transparent)}
.r-e{color:var(--r-e);background:color-mix(in srgb,var(--r-e) 14%,transparent)}
.r-f{color:var(--r-f);background:color-mix(in srgb,var(--r-f) 16%,transparent);text-decoration:underline 2px}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:.85em}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.explain{font-size:1.06em;line-height:1.95;max-width:68ch}
.explain p{margin:0 0 .5em}
.opts{display:grid;gap:8px}
.opt{text-align:start;width:100%;padding:12px 16px;font-size:1.02em;display:flex;gap:12px;align-items:center}
.opt .k{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.85em;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--sc,var(--accent));background:color-mix(in srgb,var(--sc,var(--accent)) 10%,var(--surface))}
.opt[aria-pressed="true"] .k{background:var(--sc,var(--accent));color:var(--surface);border-color:var(--sc,var(--accent))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt bdi{unicode-bidi:plaintext}
/* lab */
.lab{border:1.5px dashed var(--line);border-radius:var(--radius);padding:16px;background:var(--surface2);display:flex;flex-direction:column;gap:12px}
.lab-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lab svg{width:100%;height:auto;max-height:300px;display:block;margin:auto}
.lab .ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lab label{display:flex;flex-direction:column;gap:2px;font-size:.9em}
.lab input[type=range]{width:100%;accent-color:var(--accent)}
.lab .out{min-width:0}
.lab .readout{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lab .readout .chip{font-size:.92em;background:var(--surface)}
.svgtxt{fill:var(--ink);font-family:var(--f-body)}
.svgmuted{fill:var(--muted);font-family:var(--f-body)}
.word{font-size:1.25em;padding:8px 14px;border-radius:10px;min-width:70px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.word small{font-size:.6em;color:var(--muted)}
.word.ok{outline:3px solid var(--good)} .word.no{outline:3px solid var(--bad)}
.flip{min-height:150px;width:100%;font-size:1.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-width:2px;border-radius:var(--radius);background:var(--surface)}
.flip .big{font-size:2.1em;font-family:var(--f-he)}
/* exam */
.qnum{display:flex;gap:6px;flex-wrap:wrap}
.qnum button{min-width:40px;min-height:40px;padding:0;border-radius:10px;font-size:.88em;font-variant-numeric:tabular-nums}
.qnum button.ans{background:var(--surface2);border-color:var(--accent)}
.qnum button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnum button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.qtext{font-size:1.22em;line-height:1.8;font-weight:500}
.score{font-family:var(--f-display);font-size:3.6em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.check-list label{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.check-list input{width:20px;height:20px;accent-color:var(--accent)}
.review{display:grid;gap:10px}
.review .item{border:1px solid var(--line);border-radius:12px;padding:14px;border-inline-start:5px solid var(--good)}
.review .item.x{border-inline-start-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.88em}
.tbl{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:14px;border-radius:12px;background:var(--surface2)}
.stat b{display:block;font-size:1.7em;font-variant-numeric:tabular-nums;color:var(--accent)}
/* teacher */
aside#teacher{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.t-head{display:flex;gap:8px;align-items:center}
.t-hb{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.t-hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3em;flex:none}
.chat{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;flex:1;padding-inline-end:4px}
.msg{padding:10px 12px;border-radius:12px;line-height:1.75;font-size:.95em;max-width:95%;overflow-wrap:anywhere}
.msg.t{background:var(--surface2);border-inline-start:4px solid var(--accent);align-self:flex-start}
.tb{border-radius:10px;padding:7px 10px;margin:6px 0;background:var(--surface);border-inline-start:4px solid var(--accent)}
.tbh{display:block;font-size:.85em;margin-bottom:2px}
.tb-idea{border-color:#3b82f6}.tb-idea .tbh{color:#3b82f6}
.tb-pic{border-color:#a855f7}.tb-pic .tbh{color:#a855f7}
.tb-ex{border-color:#16a34a}.tb-ex .tbh{color:#16a34a}
.tb-warn{border-color:#f59e0b}.tb-warn .tbh{color:#d97706}
.tb-q{border-color:#ec4899;background:color-mix(in srgb,#ec4899 8%,var(--surface))}.tb-q .tbh{color:#db2777}
.mrun{white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em}
.ob{position:relative;display:inline-block;font-size:1.9em;margin:2px;line-height:1.2}.ob i{position:absolute;bottom:-3px;inset-inline-end:-3px;background:#16a34a;color:#fff;font:700 .42em/1 system-ui,sans-serif;border-radius:10px;padding:3px 5px}.ob-x{opacity:.28;filter:grayscale(1)}.ob-op{font-size:1.8em;font-weight:700;margin:0 6px;align-self:center}.ob-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}.ob-grid{display:flex;flex-direction:column;gap:2px;align-items:center}
.bk-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0}.bk{display:inline-flex;align-items:flex-end;gap:3px;flex-wrap:wrap;max-width:48%}.bk .t{display:inline-block;width:12px;height:56px;border-radius:3px;background:#2563eb}.bk .o{display:inline-block;width:12px;height:12px;border-radius:3px;background:#f59e0b}

{id:'motion',s:'phys',n:'الحركة المنتظمة والسرعة',lab:'motion',auto:1,leg:{a:'الرموز',b:'الأعداد',c:'العمليات'},steps:[
 {t:'ما هي السرعة؟',v:'v = d ÷ t',x:'السرعة = المسافة ÷ الزمن.\nv هي السرعة، d هي المسافة، t هو الزمن.\nوحدة السرعة: متر في الثانية (م/ث).',q:'سيارة قطعت 100 متر في 10 ثوانٍ. ما سرعتها؟',o:['10 م/ث','1000 م/ث','110 م/ث','0.1 م/ث'],c:0,h:'100 ÷ 10.',w:'v = 100 ÷ 10 = 10 م/ث.',p:{v:10,t:10}},
 {t:'حساب المسافة',v:'d = v × t',x:'إذا عرفنا السرعة والزمن نحسب المسافة:\nالمسافة = السرعة × الزمن.\nفي المختبر اضغط "شغّل" وشاهد السيارة.',q:'جسم يتحرك بسرعة 20 م/ث لمدة 5 ثوانٍ. ما المسافة؟',o:['4 م','25 م','100 م','15 م'],c:2,h:'20 × 5.',w:'d = 20 × 5 = 100 م.',p:{v:20,t:5}},
 {t:'تحويل الوحدات',v:'36 km/h ÷ 3.6 = 10 m/s',x:'لتحويل كم/س إلى م/ث نقسم على 3.6.\nلتحويل م/ث إلى كم/س نضرب في 3.6.',q:'كم تساوي 72 كم/س بوحدة م/ث؟',o:['20 م/ث','36 م/ث','7.2 م/ث','259 م/ث'],c:0,h:'72 ÷ 3.6.',w:'72 ÷ 3.6 = 20 م/ث.',p:{v:20,t:5}},
 {t:'رسم المسافة والزمن',v:'d – t',x:'في الرسم البياني (مسافة – زمن):\nخط مستقيم مائل ← سرعة ثابتة.\nخط أكثر ميلًا ← سرعة أكبر.\nخط أفقي ← الجسم واقف.',q:'في رسم (مسافة – زمن)، ماذا يعني الخط الأفقي؟',o:['الجسم يسرع','الجسم واقف','الجسم يرجع','السرعة كبيرة جدًا'],c:1,h:'المسافة لا تتغيّر مع الزمن.',w:'المسافة ثابتة، إذن الجسم لا يتحرك.',p:{v:10,t:6}}],

{id:'newton',s:'phys',n:'قانون نيوتن الثاني',lab:'newton',auto:1,leg:{a:'الرموز',b:'الأعداد',c:'العمليات'},steps:[
 {t:'القوة تسبّب تسارعًا',v:'F = m × a',x:'F هي القوة (بالنيوتن N).\nm هي الكتلة (بالكيلوغرام kg).\na هو التسارع: كم تزيد السرعة في كل ثانية (م/ث²).',q:'جسم كتلته 2 كغ وتسارعه 3 م/ث². ما القوة؟',o:['5 N','6 N','1.5 N','0.67 N'],c:1,h:'2 × 3.',w:'F = 2 × 3 = 6 N.',p:{F:6,m:2}},
 {t:'الكتلة والتسارع',v:'a = F ÷ m',x:'نفس القوة على كتلة أكبر ← تسارع أصغر.\nجرّب في المختبر: ثبّت القوة وزد الكتلة.',q:'نفس القوة، والكتلة صارت الضعف. ماذا يحدث للتسارع؟',o:['يصبح الضعف','يبقى كما هو','يصبح النصف','يصبح صفرًا'],c:2,h:'a = F ÷ m، والمقام صار أكبر مرتين.',w:'عندما نضاعف m يصبح a نصف ما كان.',p:{F:20,m:4}},
 {t:'وحدة القوة',v:'1 N = 1 kg × 1 m/s²',x:'النيوتن هو القوة التي تعطي كتلة 1 كغ تسارعًا 1 م/ث².\nالوزن قوة أيضًا: الوزن = الكتلة × 10 تقريبًا على الأرض.',q:'ما وحدة القوة؟',o:['الكيلوغرام','النيوتن','المتر','الجول'],c:1,h:'سمّيت على اسم العالم الذي وضع القانون.',w:'وحدة القوة هي النيوتن N.',p:{F:10,m:2}}],

 {q:'كتلة 4 كغ وتسارع 2.5 م/ث². ما القوة؟',o:['6.5 N','10 N','1.6 N','8 N'],c:1,w:'F = 4 × 2.5 = 10 N.'},

{id:'atom',s:'chem',n:'الذرّة ومكوّناتها',lab:'atom',auto:1,leg:{a:'رمز العنصر',b:'الأعداد',c:'العمليات'},steps:[
 {t:'مكوّنات الذرّة',v:'p⁺  n⁰  e⁻',x:'في وسط الذرة توجد النواة.\nفي النواة: بروتونات (شحنة موجبة +) ونيوترونات (بدون شحنة).\nحول النواة: إلكترونات (شحنة سالبة −).',q:'أين توجد البروتونات؟',o:['في النواة','حول النواة','خارج الذرة','في الإلكترون'],c:0,h:'انظر إلى المركز في الرسم.',w:'البروتونات والنيوترونات في النواة.',p:{p:2,n:2,e:2}},
 {t:'العدد الذرّي',v:'C : Z = 6',x:'العدد الذري = عدد البروتونات.\nهو الذي يحدد نوع العنصر.\nكل ذرة كربون فيها 6 بروتونات.',q:'في الكربون 6 بروتونات. ما عدده الذري؟',o:['12','6','3','1'],c:1,h:'العدد الذري = عدد البروتونات.',w:'العدد الذري للكربون 6.',p:{p:6,n:6,e:6}},
 {t:'الذرة المتعادلة',v:'O : 8p⁺ = 8e⁻',x:'في الذرة المتعادلة: عدد الإلكترونات = عدد البروتونات.\nالشحنات الموجبة والسالبة متساوية.\nفي المختبر جرّب إضافة إلكترون أو إزالته.',q:'العدد الذري للأكسجين 8. كم إلكترونًا في ذرة أكسجين متعادلة؟',o:['16','4','8','6'],c:2,h:'الإلكترونات = البروتونات.',w:'8 بروتونات، إذن 8 إلكترونات.',p:{p:8,n:8,e:8}},
 {t:'العدد الكتلي',v:'A = p + n = 11 + 12 = 23',x:'العدد الكتلي = البروتونات + النيوترونات.\nالإلكترونات خفيفة جدًا ولا نحسبها.',q:'ذرة فيها 11 بروتونًا و 12 نيوترونًا. ما عددها الكتلي؟',o:['11','12','23','1'],c:2,h:'اجمع البروتونات والنيوترونات.',w:'11 + 12 = 23 (هذا الصوديوم Na).',p:{p:11,n:12,e:11}},
 {t:'عنصر أم مركّب؟',v:'H₂O = H + H + O',x:'العنصر: نوع واحد من الذرات، مثل O أو H.\nالمركّب: ذرات من عناصر مختلفة مرتبطة معًا.\nالماء مركّب: ذرتا هيدروجين وذرة أكسجين.',q:'الماء H₂O هو:',o:['عنصر','مركّب','بروتون','إلكترون'],c:1,h:'فيه أكثر من نوع واحد من الذرات.',w:'فيه H و O، إذن مركّب.',p:{p:1,n:0,e:1}}],
 bank:[
 {q:'ما شحنة البروتون؟',o:['موجبة','سالبة','بدون شحنة','تتغيّر'],c:0,w:'البروتون موجب +.'},
 {q:'ما شحنة الإلكترون؟',o:['موجبة','سالبة','بدون شحنة','تتغيّر'],c:1,w:'الإلكترون سالب −.'},

 {t:'السؤال المفتوح والسؤال المغلق',x:'السؤال المغلق جوابه كلمة واحدة: «هل تحب الكرة؟» ← «نعم».\nالسؤال المفتوح جوابه جملة طويلة: «ما أكثر شيء تحبّه في كرة القدم؟»\nالسؤال المفتوح يجعل المحادثة تستمر.\nكلمات تبدأ سؤالًا مفتوحًا: ماذا، كيف، لماذا، ما رأيك.',q:'أي سؤال مفتوح؟',o:['هل شاهدت المباراة؟','هل أنت جائع؟','ما أكثر شخصية كرتون تحبّها، ولماذا؟','هل عندك واجب؟'],c:2,h:'السؤال المفتوح لا يُجاب بـ «نعم» أو «لا».',w:'«ما… ولماذا؟» سؤال مفتوح، جوابه جملة.',p:{k:[['سؤال مغلق','جوابه نعم أو لا'],['سؤال مفتوح','يبدأ بـ ماذا، كيف، لماذا، ما رأيك'],['سؤال متابعة','سؤال عن شيء قاله الشخص قبل قليل']]}}],

 {t:'قاعدة الجمل الثلاث',x:'عندما أتكلّم عن شيء أحبّه كثيرًا، مثل الكرتون المدبلج، من السهل أن أتكلّم وقتًا طويلًا.\nالقاعدة: أقول 3 جمل تقريبًا، ثم أتوقّف وأسأل الشخص الآخر سؤالًا.\nمثال: «شاهدت حلقة جميلة. البطل ساعد فريقه. أحببت النهاية.» ثم: «وأنت، ماذا تحب أن تشاهد؟»',q:'تكلّمت 3 جمل عن الكرتون. ماذا أفعل الآن؟',o:['أكمل 10 جمل أخرى','أتوقّف وأسأل الشخص الآخر سؤالًا','أغادر','أرفع صوتي'],c:1,h:'بعد 3 جمل: نعطي الدور للآخر.',w:'أتوقّف وأسأل، فيشعر الآخر أنني مهتمّ به.',p:{k:[['قاعدة الجمل الثلاث','3 جمل ثم سؤال للآخر'],['إعطاء الدور','«وأنت؟ ما رأيك؟»'],['الموضوع المفضّل','جميل أن أشاركه، باختصار']]}},
 {t:'علامات أن الشخص يريد الكلام',x:'المدبلج يراقب الشاشة ليعرف متى يبدأ. وأنا أراقب الشخص الآخر.\nعلامات أن الآخر يريد أن يتكلّم أو ملّ:\n1. ينظر بعيدًا أو إلى هاتفه.\n2. يقول «آه… نعم» بصوت قصير.\n3. يفتح فمه ليتكلّم.\nعندما أرى علامة: أتوقّف وأسأله.',q:'صديقك ينظر إلى هاتفه ويقول «آه… نعم». ماذا يعني هذا غالبًا؟',o:['أنه يحب كلامي كثيرًا','أنه ربما ملّ أو يريد أن يتكلّم','أنه غاضب جدًا','لا يعني شيئًا'],c:1,h:'النظر بعيدًا + جواب قصير = علامة.',w:'غالبًا ملّ أو يريد دوره. أتوقّف وأسأله.',p:{k:[['ينظر بعيدًا','ربما ملّ'],['جواب قصير','«آه… نعم»'],['يفتح فمه','يريد أن يتكلّم']]}},

{id:'soc_feel',s:'soc',n:'المشاعر ونبرة الصوت',lab:'concepts',leg:{},steps:[
 {t:'المدبلج يقرأ المشاعر',x:'قبل أن يسجّل المدبلج جملة، ينظر إلى وجه الشخصية: هل هي فرحة؟ حزينة؟ غاضبة؟ ثم يغيّر صوته حسب الشعور.\nنحن أيضًا نقرأ المشاعر من 3 أشياء:\n1. الوجه: الفم والحاجبان.\n2. الصوت: عالٍ أو منخفض، سريع أو بطيء.\n3. الجسم: يداه، وقفته.',q:'من أين نعرف شعور الشخص؟',o:['من لون ملابسه','من الوجه والصوت والجسم','من اسمه','من عمره'],c:1,h:'المدبلج ينظر إلى 3 أشياء.',w:'الوجه + الصوت + الجسم.',p:{k:[['فرح','ابتسامة، صوت مرتفع قليلًا'],['حزن','فم إلى الأسفل، صوت منخفض بطيء'],['غضب','حاجبان متقاربان، صوت عالٍ'],['توتّر','حركة كثيرة، كلام سريع']]}},
 {t:'نفس الكلمة بنبرات مختلفة',x:'المدبلج يستطيع أن يقول «حسنًا» بثلاث طرق:\n«حسنًا!» بصوت فرح = موافق ومبسوط.\n«حسنًا…» بصوت منخفض = موافق لكنه حزين أو غير راضٍ.\n«حسنًا!!» بصوت عالٍ وقوي = غاضب.\nلذلك نسمع النبرة، وليس الكلمة فقط.',q:'أخوك قال «حسنًا…» بصوت منخفض ووجه حزين. ماذا يعني غالبًا؟',o:['هو سعيد جدًا','وافق لكنه غير راضٍ','يمزح','لم يسمعني'],c:1,h:'انتبه للصوت والوجه، ليس للكلمة.',w:'الكلمة «موافق» لكن النبرة تقول «غير راضٍ».',p:{k:[['النبرة','طريقة قول الكلمة'],['«حسنًا!»','فرح'],['«حسنًا…»','غير راضٍ'],['«حسنًا!!»','غضب']]}},
 {t:'المزاح والسخرية',x:'أحيانًا يقول الناس عكس ما يقصدون، للمزاح.\nمثال: المطر قوي جدًا، وصديقك يقول مبتسمًا: «يا له من طقس رائع!»\nهو لا يقصد أن الطقس رائع. هو يمزح.\nالعلامات: ابتسامة، أو صوت فيه ضحكة، والكلام عكس ما نراه.\nإذا لم أكن متأكّدًا، أسأل بلطف: «هل تمزح؟»',q:'زميلك وقع منه الكوب وقال مبتسمًا: «أنا أمهر شخص في العالم!» ماذا يقصد؟',o:['أنه فعلًا أمهر شخص','يمزح عن نفسه','أنه غاضب مني','يطلب أن أصفّق'],c:1,h:'الكلام عكس ما حدث + ابتسامة.',w:'يمزح عن نفسه. يمكن أن أبتسم أو أقول: «يحدث للجميع».',p:{k:[['مزاح','كلام عكس الواقع مع ابتسامة'],['إذا لم أتأكّد','«هل تمزح؟»'],['ردّ لطيف','«يحدث للجميع»']]}}],

      if(!resp.ok){let j=null;try{j=await resp.json()}catch(e){}throw {code:(j&&j.code)||('http_'+resp.status),message:j&&j.message}}
      const rd=resp.body.getReader(),dc=new TextDecoder();let acc='',last=0;

}

function hl(text,t){
  const sid=t.s;let re;

  else if(sid==='he')re=/([\u0590-\u05FF]+(?:\s[\u0590-\u05FF]+)*)/g;
  else if(sid==='en')re=/([A-Za-z][A-Za-z'’]*(?:\s[A-Za-z][A-Za-z'’]*)*)/g;
  else if(sid==='fr')re=/([A-Za-zÀ-ÿŒœ][A-Za-zÀ-ÿŒœ'’\-]*(?:\s[A-Za-zÀ-ÿŒœ][A-Za-zÀ-ÿŒœ'’\-]*)*)/g;

    else if(sid==='he')out+=`<span class="fw he">${esc(w)}</span>`;

function fromRecord(x){return {E:{qs:x.d.map(d=>({q:d.q,o:d.o,c:d.c,w:d.w,tid:d.t})),ans:x.d.map(d=>d.a)},rec:x}}
function routeFromHash(){
  const h=decodeURIComponent(location.hash.slice(1));if(!h)return false;const i=h.indexOf('-');const r=i<0?h:h.slice(0,i),arg=i<0?'':h.slice(i+1);
  if(E&&!E.done&&VIEW==='examrun')return true;
  if(r==='lesson'&&topic(arg)){startLesson(arg);return true}
  if(r==='learn'){if(subj(arg))CUR.sub=arg;go('learn');return true}
  if(r==='exam'){examSetup=null;if(topic(arg))examSetup={sub:topic(arg).s,ids:new Set([arg]),n:Math.min(10,poolFor(arg).length),mode:'exam',timer:S.settings.timer||'none'};go('exam');return true}
  if(r==='result'){const x=EXAMS.find(e=>String(e.ts)===arg);if(x&&x.d){lastReview=fromRecord(x);go('examres')}else go('progress');return true}
  if(r==='review'){const due=dueReviews();if(due.length)startExam({pool:due.slice(0,12).map(r=>r.q),n:Math.min(12,due.length),mode:'practice',timer:'none',review:true,ids:[]});else go('home');return true}
  if(r==='test'){go('testnew');return true}
  if(r==='social'){go('social');return true}
  if(r==='recall'){setTimeout(startRecall,600);return true}
  if(r==='calm'){CALM=null;go('calm');return true}
  if(r==='spell'){SP=null;go('spell');return true}
  if(r==='story'){STY=null;go('story');return true}
  if(r==='rp'&&SCEN.find(x=>x.id===arg)){go('social');setTimeout(()=>{if(SAMPLE)startRP(arg)},800);return true}
  if(r==='timetable'){go('timetable');return true}
  if(r==='open'&&topic(arg)){startOpen(arg);return true}
  if(r==='addtopic'){ADD=null;if(subj(arg))CUR.sub=arg;go('addtopic');return true}
  if(['home','progress','settings','achieve'].includes(r)){go(r);return true}
  return false}
window.addEventListener('hashchange',()=>{routeFromHash()});

const SYSJ=`أنت "الأستاذ سامر"، معلّم لطيف وصبور لطفلة اسمها جودي، عمرها 8 سنوات، في الصف الثالث في مدرسة عربية في إسرائيل. تتعلّم: الرياضيات، العربية، الإنجليزية، العبرية، الفرنسية.

قواعدك:
- اكتب بالعربية البسيطة جدًا، بجمل قصيرة (من 5 إلى 8 كلمات). لا تزيد عن 4 جمل في الجواب الواحد.
- اشرح بمثال من حياة طفلة: ألعاب، حلويات، حيوانات، العائلة، المدرسة. كوني مبدعة: اجعلي كل شرح قصة صغيرة أو مغامرة قصيرة بشخصيات (أرنب يعدّ الجزر، أميرة تقسم الكعكة…) وغيّري الأمثلة كل مرة. ادخلي في الموضوع فورًا دون مقدّمات.
- في الإنجليزية والعبرية والفرنسية: اكتب الكلمة بلغتها ثم معناها بالعربية، ثم طريقة نطقها بحروف عربية.
- لا تستعمل جداول ولا مصطلحات صعبة.
- جودي ذكية جدًا وخيالها واسع وتفهم بالصور. اشرحي دائمًا بالصورة أولًا ثم بالكلام: في كل شرح أضف رسمًا واحدًا داخل كتلة كود من نوع viz بصيغة JSON صحيحة فقط، يحرّكه التطبيق لها. اكتب قبل الرسم جملة قصيرة تقول لها ماذا تضغط وماذا تلاحظ. وخيّليها: «تخيّلي أن…» ثم مثال خيالي ممتع من عالم الحيوانات أو الحلوى أو الفضاء أو الأميرات.
الأنواع المتاحة (استعمل إيموجي مناسبًا):
1) أشياء تُعدّ للجمع والطرح والضرب (عدد كل منها حتى 20): \`\`\`viz
{"type":"objects","e":"🍪","a":3,"b":4,"op":"+"}
\`\`\`
op هو + أو − أو × (في الضرب a صفوف وفي كل صف b).
2) عشرات وآحاد للأعداد الكبيرة: {"type":"blocks","a":27,"b":15,"op":"+"} (op هو + أو −).
3) بطاقات بصورة وكلمة تنطقها بصوت عالٍ عند الضغط، للمفردات في أي لغة: \`\`\`viz
{"type":"cards","l":"fr","items":[["🍎","pomme","تفاحة"],["🐱","chat","قطة"]]}
\`\`\`
l هو ar أو en أو he أو fr. كل عنصر: [إيموجي، الكلمة بلغتها، معناها بالعربية]. حتى 8 بطاقات.
4) كسر كقطع دائرة وشريط: {"type":"fraction","n":1,"d":4}
5) خطوات تظهر واحدة بعد واحدة: {"type":"steps","lines":["12 + 5","= 17"],"why":["نضيف 5 إلى 12"]}
6) سؤال بخيارات تضغط عليها: {"type":"choice","q":"…","o":["…","…"],"c":0,"w":"لماذا هذا صحيح"} (c رقم الخيار الصحيح من 0).
7) رسم شكل هندسي حقيقي مع خصائصه (أضلاع، زوايا، تساوي الأضلاع، المحيط) تضغط عليها جودي فتظهر على الرسم: {"type":"geo","shape":"square"}
الأشكال: square (مربع) و rectangle (مستطيل) و triangle (مثلث) و rhombus (معيّن) و pentagon (مخمّس) و hexagon (مسدّس) و circle (دائرة).
مهم: عندما تطلب جودي رسم شكل هندسي أو عندما تشرحين شكلًا، استعملي geo دائمًا ولا تستعملي objects. ثم اشرحي خصائصه بجمل قصيرة: عدد الأضلاع، عدد الزوايا، هل الأضلاع متساوية، وما هو المحيط.
لا تضع أكثر من رسم واحد في الجواب.
- شجّعها بجملة قصيرة وصادقة على جهد محدّد قامت به، مثل «أحسنتِ لأنك جرّبتِ مرة ثانية».
- اختم بسؤال صغير جدًا لها، حتى تجيب وتتأكد أنها فهمت.
- إذا أخطأت، قل لها: «قريب! لنجرّب معًا» ثم أعطها تلميحًا قبل الجواب.
- إذا شعرت أنها متعبة أو منزعجة، اقترح استراحة قصيرة أو تنفّسًا هادئًا.
- خاطبيها بصيغة المؤنث دائمًا.`;

function validPic(p){if(!p||typeof p!=='object'||!PICOK.includes(p.type))return undefined;try{if(JSON.stringify(p).length>1800)return undefined}catch(e){return undefined}
  if(p.type==='cards'){p.l=['ar','en','he','fr'].includes(p.l)?p.l:'ar';p.items=(Array.isArray(p.items)?p.items:[]).filter(x=>Array.isArray(x)&&x.length>=2).slice(0,8).map(x=>x.slice(0,3).map(y=>String(y).slice(0,60)));if(!p.items.length)return undefined}
  if(p.type==='objects'){p.e=String(p.e||'🍎').slice(0,8);p.a=Math.max(0,Math.min(20,+p.a||0));p.b=Math.max(0,Math.min(20,+p.b||0));p.op=['+','−','×'].includes(p.op)?p.op:'+'}
  if(p.type==='blocks'){p.a=Math.max(0,Math.min(99,+p.a||0));p.b=Math.max(0,Math.min(99,+p.b||0));p.op=p.op==='−'?'−':'+'}
  if(p.type==='fraction'){p.n=Math.max(0,Math.min(12,+p.n||1));p.d=Math.max(1,Math.min(12,+p.d||2))}
  if(p.type==='geo'){const ok=['square','rectangle','triangle','rhombus','pentagon','hexagon','circle'];if(!ok.includes(p.shape))return undefined}
  if(p.type==='steps'){p.lines=(Array.isArray(p.lines)?p.lines:[]).slice(0,6).map(x=>String(x).slice(0,80));p.why=(Array.isArray(p.why)?p.why:[]).slice(0,6).map(x=>String(x).slice(0,80));if(p.lines.length<2)return undefined}
  if(p.type==='choice'){if(!Array.isArray(p.o)||p.o.length<2||!Number.isInteger(p.c))return undefined;p.q=String(p.q||'').slice(0,160);p.o=p.o.slice(0,4).map(x=>String(x).slice(0,60));p.w=String(p.w||'').slice(0,160)}
  return p}
function validTopic(o,sub){if(!o||typeof o!=='object'||!Array.isArray(o.steps))return null;
  const okQ=q=>q&&typeof q.q==='string'&&Array.isArray(q.o)&&q.o.length===4&&q.o.every(x=>typeof x==='string'&&x.trim())&&Number.isInteger(q.c)&&q.c>=0&&q.c<4;
  const steps=o.steps.filter(st=>st&&typeof st.t==='string'&&typeof st.x==='string'&&okQ(st)).slice(0,6).map(st=>({t:st.t.slice(0,120),v:String(st.v||'').slice(0,160),x:st.x.slice(0,900),q:st.q.slice(0,300),o:st.o.map(x=>x.slice(0,140)),c:st.c,h:String(st.h||'').slice(0,240),w:String(st.w||'').slice(0,300),k:(Array.isArray(st.k)?st.k:[]).filter(p=>Array.isArray(p)&&p.length>=2).slice(0,6).map(p=>[String(p[0]).slice(0,60),String(p[1]).slice(0,160)]),pic:PROFILE?validPic(st.pic):undefined}));
  if(steps.length<2)return null;
  const bank=(Array.isArray(o.bank)?o.bank:[]).filter(okQ).slice(0,15).map(q=>({q:q.q.slice(0,300),o:q.o.map(x=>x.slice(0,140)),c:q.c,w:String(q.w||'').slice(0,300)}));
  return {id:'c_'+Date.now().toString(36),s:sub,n:String(o.n||'موضوع جديد').slice(0,80),steps,bank}}
function resizeImage(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72).split(',')[1])};img.onerror=rej;img.src=url})}

    const [n,x,q,c,...w]=vals;if(new Set([c,...w]).size<4){A.msg='اجعل الإجابات الأربع مختلفة.';render();return}

function resetStep(){L.sel=null;L.checked=false;L.ok=false;L.hint=false;initLab()}
function finishLesson(t){
  const n=t.steps.length;let sum=0;const missed=[];
  for(let i=0;i<n;i++){const k=L.tries[i]||1;sum+=k===1?100:k===2?70:40;if(k>1){missed.push(i);const st=t.steps[i];addReview({q:st.q,o:st.o,c:st.c,w:st.w||st.h,tid:t.id})}}
  const score=Math.round(sum/n);const prev=S.lessons[t.id];
  S.lessons[t.id]={done:true,score:Math.max(score,prev?.score||0),last:score,missed,ts:Date.now()};schedRecall(t.id,'app');
  markDay();L.finished={score,missed};advance('lesson');addStars(prev?5:10,prev?'أعدت درس «'+t.n+'»':'أنهيت درس «'+t.n+'»');checkBadges();checkGoal();render();
}

const uniqOpts=(c,arr)=>{const o=[String(c)];for(const x of arr){const v=String(x);if(!o.includes(v))o.push(v)}return o.slice(0,3)};

/* ============ TEACHER VISUALS (interactive) ============ */
const VZS={};
const vzN=v=>{const r=Math.round(v*100)/100;return String(r).replace('-','−')};
function vzParse(src){const s=String(src).replace(/−/g,'-').replace(/×|·/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,'sqrt').toLowerCase();let i=0;const toks=[];
  while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;toks.push({t:'n',v:parseFloat(s.slice(i,j))});i=j;continue}
    if(/[a-z_]/.test(c)){let j=i;while(j<s.length&&/[a-z_0-9]/.test(s[j]))j++;toks.push({t:'i',v:s.slice(i,j)});i=j;continue}if('+-*/^(),'.includes(c)){toks.push({t:c});i++;continue}throw new Error('bad')}
  const out=[];toks.forEach((k,n)=>{const p=out[out.length-1];if(p&&(p.t==='n'||p.t===')'||(p.t==='i'&&!FN[p.v]))&&(k.t==='n'||k.t==='i'||k.t==='('))out.push({t:'*'});out.push(k)});
  let p=0;const peek=()=>out[p],eat=t=>{if(out[p]&&out[p].t===t)return out[p++];throw new Error('expect '+t)};
  function ex(){let a=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const o=out[p++].t,b=term(),A=a;a=o==='+'?e=>A(e)+b(e):e=>A(e)-b(e)}return a}
  function term(){let a=un();while(peek()&&(peek().t==='*'||peek().t==='/')){const o=out[p++].t,b=un(),A=a;a=o==='*'?e=>A(e)*b(e):e=>A(e)/b(e)}return a}
  function un(){if(peek()&&peek().t==='-'){p++;const a=un();return e=>-a(e)}if(peek()&&peek().t==='+'){p++;return un()}return pw()}
  function pw(){const a=at();if(peek()&&peek().t==='^'){p++;const b=un();return e=>Math.pow(a(e),b(e))}return a}
  function at(){const k=out[p++];if(!k)throw new Error('end');if(k.t==='n')return()=>k.v;if(k.t==='('){const a=ex();eat(')');return a}
    if(k.t==='i'){if(FN[k.v]){eat('(');const a=ex();eat(')');return e=>FN[k.v](a(e))}if(k.v==='pi')return()=>Math.PI;if(k.v==='e'&&!(peek()&&peek().t==='('))return e=>('e' in e?e.e:Math.E);return e=>{if(!(k.v in e))throw new Error('var '+k.v);return e[k.v]}}throw new Error('tok')}
  const f=ex();if(p<out.length)throw new Error('trail');return f}
const FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp};
function vzExtract(t){const specs=[];let txt=String(t).replace(/```\s*note[\s\S]*?```/g,'').replace(/```\s*note[\s\S]*$/,'').replace(/```\s*viz\s*([\s\S]*?)```/g,(m,j)=>{try{specs.push(JSON.parse(j.trim()))}catch(e){}return '\n\uE000'+String.fromCharCode(0xE100+specs.length-1)+'\uE000\n'});txt=txt.replace(/```\s*viz[\s\S]*$/,'');return {txt,specs}}
function plainTeacher(t){return vzExtract(t).txt.replace(/\uE000[\uE100-\uE1FF]\uE000/g,'')}

function vzGeo(el,sp,st){const g=GEO[sp.shape]||GEO.square;if(!st.v)st.v={mode:sp.mode||'',a:3,b:5};

    if(m==='corners')for(let i=0;i<n;i++){const p=P[i],a=P[(i+n-1)%n],b=P[(i+1)%n],u=[a[0]-p[0],a[1]-p[1]],w=[b[0]-p[0],b[1]-p[1]],lu=Math.hypot(...u),lw=Math.hypot(...w);u[0]/=lu;u[1]/=lu;w[0]/=lw;w[1]/=lw;

    if(m==='equal'&&g.eq)for(let i=0;i<n;i++){const [a,b]=side(i),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,c=g.eq==='opp'&&i%2?2:1;
      for(let t=0;t<c;t++){const o=(t-(c-1)/2)*7,x=mx+dx/L*o,y=my+dy/L*o;h+=`<line x1="${x-nx*9}" y1="${y-ny*9}" x2="${x+nx*9}" y2="${y+ny*9}" stroke="#dc2626" stroke-width="3"/>`}}

const weekKey=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10)};
function curChall(){S.chall=S.chall||{};const k=weekKey();if(!S.chall[k]){const used=new Set(Object.values(S.chall).map(c=>c.id));const pool=CHALL.filter(c=>!used.has(c.id));const n=Math.floor(Date.now()/(7*864e5));const pick=(pool.length?pool:CHALL)[n%(pool.length||CHALL.length)];S.chall[k]={id:pick.id,t:pick.t};persist()}return {...S.chall[k],k,c:CHALL.find(x=>x.id===S.chall[k].id)||CHALL[0]}}
function challCard(){const x=curChall();if(!x.c)return '';
  return `<section class="card chall ${x.done?'done':''}"><div class="row between"><h3>🎯 تحدّي الأسبوع</h3>${x.done?'<span class="chip good">أنجزته ✓</span>':`<span class="chip">${STAR} 10</span>`}</div>
   <p class="qtext" style="margin:8px 0 4px">${x.c.ic} ${esc(x.c.t)}</p><p class="muted small" style="margin:0 0 10px">${esc(x.c.h)}</p>
   ${x.done?`<p class="small" style="margin:0">${{good:'😊 كان جيدًا',ok:'😐 كان عاديًا',hard:'😟 كان صعبًا'}[x.how]||''}${x.note?' · '+esc(x.note):''}</p>`:`<div class="row"><button class="btn-p" data-chdone>فعلتها! 🎉</button><button class="btn-ghost" data-chswap>تحدٍّ آخر</button><button class="btn-ghost" data-start="${x.c.tid}">ذكّرني كيف</button></div>`}</section>`}
function bindChall(v){const d=v.querySelector('[data-chdone]');if(d)d.onclick=openChallDone;const sw=v.querySelector('[data-chswap]');if(sw)sw.onclick=()=>{const x=curChall();const others=CHALL.filter(c=>c.id!==x.id);const pk=others[Math.floor(Math.random()*others.length)];S.chall[x.k]={id:pk.id,t:pk.t};persist();render()}}
function openChallDone(){const x=curChall();const o=$('overlay');o.hidden=false;let how=null;
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true" style="max-width:420px"><h2>أحسنت! 🎉</h2><p style="margin:0">«${esc(x.c.t)}»</p><b>كيف كان؟</b><div class="row" style="justify-content:center">${[['good','😊 جيد'],['ok','😐 عادي'],['hard','😟 صعب']].map(([k,l])=>`<button data-how="${k}" aria-pressed="false">${l}</button>`).join('')}</div>
   <label class="field" style="width:100%"><span class="small muted">ماذا حدث؟ (اختياري، جملة واحدة)</span><input id="chNote" maxlength="200" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.5em;background:var(--surface)"></label>
   <div class="row" style="justify-content:center"><button class="btn-p" id="chOk" disabled>احفظ</button><button class="btn-ghost" id="chNo">ليس الآن</button></div></div>`;
  o.querySelectorAll('[data-how]').forEach(b=>b.onclick=()=>{how=b.dataset.how;o.querySelectorAll('[data-how]').forEach(z=>z.setAttribute('aria-pressed',String(z===b)));$('chOk').disabled=false});
  $('chNo').onclick=()=>{o.hidden=true};
  $('chOk').onclick=()=>{const note=$('chNote').value.trim().slice(0,200);S.chall[x.k]={...S.chall[x.k],done:1,how,note,ts:Date.now()};o.hidden=true;addStars(10,'تحدّي الأسبوع');checkBadges();persist(true);render();
    const msg=`أنجزت تحدّي الأسبوع: «${x.c.t}». كان ${({good:'جيدًا',ok:'عاديًا',hard:'صعبًا'})[how]}.${note?' ماذا حدث: '+note:''}`;
    if(SAMPLE){$('teacher').classList.add('open');ask(msg+'\n(أعطني ردًّا قصيرًا مشجّعًا: ماذا فعلت جيدًا بالضبط، ونصيحة واحدة صغيرة للمرة القادمة إن كان صعبًا. بدون شكل الشرح الكامل.)','simple')}
    else teacherSay(how==='hard'?'أحسنت لأنك حاولت! الشيء الصعب يصبح أسهل مع التدريب، مثل إعادة اللقطة في الاستوديو.':'رائع يا يمان! هذا تقدّم حقيقي خارج التطبيق. أنا فخور بك.')}}

const SYS=`أنت "الأستاذ سامر"، معلّم ماهر وصبور وهادئ لطالب اسمه يمان، في الصف العاشر أو الحادي عشر في مدرسة عربية في إسرائيل (منهاج وزارة التربية، ومستوى البجروت). يمان على طيف التوحّد: يفهم جيدًا عندما يكون الشرح حرفيًا ومنظّمًا ومتوقّعًا، ويتعب من النص الطويل والكلام العام.

هدفك: أن يفهم يمان الفكرة فعلًا، لا أن تقرأ له الشرح مرة أخرى.
كن مبدعًا وحيًّا: ابدأ كل شرح بتشبيه أو مشهد قصير من عالم يمان واهتماماته (الدبلجة، الرسوم المتحرّكة، القصص) يجعل الفكرة تُرى بالعين، ثم انتقل إلى القاعدة. اجعل الأمثلة طازجة ومختلفة في كل مرة، وكن مباشرًا وسريعًا: لا مقدّمات ولا تكرار.

شكل الجواب (التزم به في كل شرح، كل جزء يبدأ في سطر جديد بهذه الكلمات بالضبط):
الفكرة: جملة واحدة أو جملتان فقط، تقول ما هو الشيء ولماذا نحتاجه.
صورة في الذهن: تشبيه ملموس واحد من الحياة اليومية أو من عالم يمان، يساعد على رؤية الفكرة. تخطّاه إذا لم يكن مفيدًا فعلًا.
مثال محلول:
1. خطوة واحدة في كل سطر، بأرقام حقيقية، ومع سبب قصير بعد «لأن».
2. ...
انتبه: الخطأ الأكثر شيوعًا في هذا الموضوع، وكيف نتجنّبه. سطر واحد.
سؤال لك: سؤال قصير واحد بأرقام مختلفة، ليتأكّد يمان أنه فهم. لا تكتب حلّه.

رسم تفاعلي (مهمّ جدًا، يمان يفهم بالصور):
في كل شرح لموضوع يمكن رسمه، أضف بعد «مثال محلول» رسمًا تفاعليًا واحدًا داخل كتلة كود من نوع viz، بصيغة JSON صحيحة فقط. التطبيق يحوّلها إلى رسم يحرّكه يمان بإصبعه. الأنواع المتاحة:
1) شكل هندسي مع مؤشّرات وحساب المساحة مباشرة:
\`\`\`viz
{"type":"shape","shape":"kite","p":{"d1":8,"d2":6}}
\`\`\`
الأشكال: rect (a,b) و square (a) و triangle (b,h) و parallelogram (b,h) و trapezoid (a,b,h) و kite أي الدالتون (d1,d2) و rhombus (d1,d2) و circle (r). القيم بين 1 و 12.
2) رسم دالة مع مؤشّرات للمعاملات (يمان يلمس الرسم ويرى النقاط):
\`\`\`viz
{"type":"graph","f":"a*x^2+b*x+c","p":{"a":1,"b":-2,"c":-3},"x":[-5,5]}
\`\`\`
يمكن أن تكون f قائمة حتى 3 دوال، مثلًا ["2*x+1","-x+4"] لتقاطع مستقيمين. استعمل * للضرب و ^ للأس، والمتغيّر x فقط، والمعاملات في p. استعمل "r":{"a":[-3,3,0.5]} لتحديد مدى مؤشّر.
3) حل معادلة خطوة خطوة، يمان يضغط «الخطوة التالية»:
\`\`\`viz
{"type":"steps","lines":["2x + 3 = 11","2x = 8","x = 4"],"why":["نطرح 3 من الطرفين","نقسم الطرفين على 2"]}
\`\`\`
4) كسر كقطع دائرة وشريط: {"type":"fraction","n":3,"d":4}
5) «سؤال لك» بخيارات يضغط عليها يمان (استعمله بدل كتابة «سؤال لك» نصًّا عندما يناسب):
\`\`\`viz
{"type":"choice","q":"ما مساحة دالتون قطراه 10 و 4؟","o":["14","20","40"],"c":1,"w":"10 · 4 = 40، ثم نقسم على 2 فنحصل على 20."}
\`\`\`
c هو رقم الخيار الصحيح ابتداءً من 0. لا تكشف الحل في النص قبل الكتلة.
اكتب قبل الرسم جملة واحدة تقول ليمان ماذا يحرّك وماذا يلاحظ، مثلًا: «حرّك القطر الأول، ولاحظ أن المساحة تكبر».

ذاكرتك عن يمان:
ستصلك مع كل رسالة معلومات عن مواضيعه الضعيفة وأخطائه الأخيرة وملاحظاتك السابقة. استعملها بلطف: إذا كان الخطأ الحالي يشبه خطأً سابقًا، قل ذلك بوضوح، مثلًا: «في الامتحان الأخير اخترت كذا. انتبه هنا لنفس النقطة». لا تذكر النسب المئوية ليمان، ولا تقل له إنه ضعيف.
إذا لاحظت شيئًا ثابتًا ومفيدًا عن طريقة تعلّم يمان (خطأ يتكرّر، طريقة شرح نجحت معه، كلمة لا يفهمها)، أضف في آخر جوابك كتلة مخفية، سطرًا واحدًا قصيرًا، ولا تضفها في كل مرة، فقط عندما تتعلّم شيئًا جديدًا:
\`\`\`note
يخلط بين إشارة السالب عند فتح الأقواس
\`\`\`

قواعد مهمّة:
- اشرح الموضوع نفسه بدقّة. لا تكتب كلامًا عامًا مثل «هذا موضوع مهم» أو «ركّز جيدًا».
- استعمل المصطلحات التي تُستعمل في الكتب المدرسية العربية في إسرائيل، واكتب المصطلح بالإنجليزية أو العبرية بين قوسين عند الحاجة.
- تأكّد من الحساب في كل خطوة قبل أن تكتبها. إذا لم تكن متأكدًا، قل ذلك بوضوح.
- العربية الفصحى البسيطة، جمل قصيرة وحرفية. لا مجاز غامض، ولا سخرية، ولا مبالغة، ولا علامات تعجّب كثيرة.
- الرموز بشكل بسيط: x² و 3x + 2 = 8 و √9 = 3. ضع كل معادلة في سطر وحدها.
- إذا قال يمان «مش فاهم» أو طلب شرحًا أبسط: لا تكرّر نفس الشرح. اشرح بطريقة أخرى: رسم بالكلمات، أو أرقام أصغر، أو خطوات أصغر.
- إذا أجاب يمان عن «سؤال لك»: قل أولًا هل الجواب صحيح. إذا كان خطأ، أشر إلى الخطوة التي فيها الخطأ بالضبط، ثم أعطه فرصة ثانية.
- إذا طلب تلميحًا: أعطِ تلميحًا واحدًا صغيرًا فقط (سطران)، بدون الحل، وبدون شكل الجواب الكامل.
- إذا سأل سؤالًا قصيرًا أو بسيطًا (معنى كلمة، نعم أو لا): أجب باختصار، بدون شكل الجواب الكامل.
- الطول: حتى 200 كلمة تقريبًا (كتل الرسم لا تُحسب). إذا كان الموضوع كبيرًا، اشرح الجزء الأول فقط، واسأله: «نكمل الجزء الثاني؟»
- يمان قد يكتب بالعامية أو مع أخطاء إملائية. افهم قصده ولا تصحّح إملاءه.
- شجّع يمان بصدق وتحديد: قل ماذا فعل جيدًا بالضبط. أحيانًا استعمل تعابير من عالم الدبلجة: «لقطة ممتازة»، «نعيد اللقطة ونكمل».
- إذا سأل عن موقف اجتماعي (صديق، خلاف، كيف أتكلّم مع أحد)، ساعده بخطوات واضحة وجمل جاهزة يستطيع قولها، واقترح عليه التدريب في «استوديو المهارات الاجتماعية».
- إذا كان متعبًا أو متوتّرًا، اقترح استراحة قصيرة بلطف.
- إذا سأل عن شيء خارج الدراسة، أجب باختصار ولطف ثم أرجعه للدرس.`;

}
